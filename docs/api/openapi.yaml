  # ===================== Crew =====================
  /conversations:
    get:
      tags: [Crew]
      operationId: listConversations
      summary: Your rooms, most recently active first
      description: Includes your family's room. Expired temporary rooms are left out.
      x-auth: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Conversation" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Crew]
      operationId: createConversation
      summary: Open a room
      description: Family and context rooms return the existing room if there is one (still 201).
      x-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConversationInput" }
      responses:
        "201":
          description: The room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /conversations/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Crew]
      operationId: getMessages
      summary: Newest message page, returned oldest first
      x-auth: user
      parameters:
        - { name: before, in: query, schema: { type: string, format: uuid }, description: Message cursor; return messages older than this message. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Message" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Crew]
      operationId: sendMessage
      summary: Send a message to the crew
      description: |
        Stores the message and queues a `crew_request` job. Follow it with /jobs/{id}/events.
        Normal messages are limited to 30 sends per user per 10 minutes and the monthly allowance.
        Crisis messages are answered first with a ready zero-cost job, without queueing specialists.
      x-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageInput" }
      responses:
        "202":
          description: The stored message and its job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendMessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "402": { $ref: "#/components/responses/LimitReached" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /jobs:
    get:
      tags: [Crew]
      operationId: listJobs
      summary: Your recent background jobs, newest first
      description: Own jobs only (D28). The crew panel calls `?active=1` for queued and working jobs.
      x-auth: user
      parameters:
        - { name: active, in: query, schema: { type: boolean }, description: "`1`/`true` keeps queued and working jobs." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CrewJob" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Crew]
      operationId: getJob
      summary: A background job's current state
      x-auth: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrewJob" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /jobs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Crew]
      operationId: streamJobEvents
      summary: Stream a job's progress as server-sent events
      description: |
        Sends `event: job` with the current CrewJob right away, then again whenever `status` or
        the length of `progress` changes (polled every 1000 ms). Sends `event: end` with `{}` on a
        terminal status (`ready`, `needs_input`, `failed`) or after 130 s, then closes. If the last
        `job` frame isn't terminal, the stream timed out; reconnect or poll /jobs/{id}. Unknown or
        inaccessible jobs are a 404 JSON error before the stream opens.

        While nothing changes, the stream writes a `: ping` comment every 15 s; `EventSource`
        ignores it. The response is `text/event-stream; charset=utf-8` and sets
        `Cache-Control: no-cache, no-transform`, `Connection: keep-alive`, and
        `X-Accel-Buffering: no`, so neither the app's compression nor a proxy buffers it. It sends
        no `Content-Encoding`.
      x-auth: user
      responses:
        "200":
          description: The event stream.
          headers:
            Cache-Control:
              schema: { type: string, const: "no-cache, no-transform" }
            X-Accel-Buffering:
              schema: { type: string, const: "no" }
          content:
            text/event-stream:
              schema:
                type: string
                description: "Frames of `event: job|end` and `data: <JSON>` separated by blank lines, plus `: ping` comment lines while idle. `job` data is a CrewJob."
              example: |
                event: job
                data: {"id":"5b0e...","kind":"crew_request","status":"working","progress":[{"at":"2026-10-06T15:00:02.000Z","role":"scout","text":"Checking local scholarships"}]}

                : ping

                event: end
                data: {}
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /actions/apply:
    post:
      tags: [Crew]
      operationId: applyActionCard
      summary: Apply an action card from a crew reply
      description: |
        Idempotent per (messageId, cardId): the first call runs the card and stores a receipt;
        later calls return the same receipt without running it again. In a family room only the
        student can apply cards other than `open_link`. Another apply of this card is still
        running: 409; retry in a minute. Memory cards (`confirm_fact`, `record_decision`) in
        temporary chats: 400.
      x-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyActionInput" }
      responses:
        "200":
          description: The receipt (new or existing).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionReceipt" }
        "400":
          description: |
            `invalid_input`: validation failed, or the card is a memory card (`confirm_fact`,
            `record_decision`) in a temporary chat, which doesn't save memory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`conflict`: another apply of this card is still running; retry in a minute."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

