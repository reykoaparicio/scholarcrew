openapi: 3.1.0
info:
  title: ScholarCrew API
  version: "1.0.0"
  summary: JSON API for the ScholarCrew web app and browser extension.
  description: |
    Every route is under `/api/v1`. See `docs/api/README.md` for authentication, CSRF,
    errors, pagination, rate limits, parent reads with `studentId`, jobs and the event
    stream, action cards, files, and extension CORS.

    Conventions:

    - Request bodies are strict (`additionalProperties: false`); unknown fields are a 400.
      Response schemas don't set it, so new response fields can appear within v1.
    - Money is integer whole US dollars (`*Usd`). Calendar dates are `YYYY-MM-DD`
      (`format: date`); instants are ISO 8601 UTC (`format: date-time`).
    - Creates return 201, job starts 202, empty results 204, everything else 200.
    - Every 429 carries `Retry-After` (seconds until the limit window ends).
    - `x-auth` on each operation names the route auth mode: `user`, `admin`, `optional`,
      `none`, or `bearer`. `admin` routes return 404 to signed-in non-admins.
    - Cookie-authenticated writes (`user`, `admin`, `optional`, any method but GET/HEAD/OPTIONS)
      need `Origin` equal to the app origin, or they fail with 403.
    - Every error body is `ErrorBody`. Any route can also return 500 `internal`; operations
      don't repeat it.
    - Request bodies are read through a byte cap: JSON 256 KB, 64 KB on `none` routes, uploads
      10 MB plus multipart overhead, the CSV import 5 MB. Past the cap the answer is 413
      `invalid_input`, with or without `Content-Length`. Only uploads, the CSV import, the webhook,
      and the public routes list 413; any JSON body route can return it.
    - Read routes that take `studentId` accept it as an optional query parameter (D23); it
      defaults to the caller.

    Schemas are translated from `@scholarcrew/domain` (plans/02-domain.md) and keep its names.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: "{appUrl}/api/v1"
    description: Any deployment
    variables:
      appUrl:
        default: https://scholarcrew.example
        description: The deployment's APP_URL.
security:
  - cookieAuth: []
tags:
  - name: Auth
    description: Magic-link sign-in, sign-out, and the dev outbox.
  - name: Profile
    description: The signed-in user, profile, and onboarding.
  - name: Memory
    description: Facts, candidates, decisions, and sensitive facts.
  - name: Family
    description: Family members, invites, share settings, budget, and tasks.
  - name: Helpers
    description: Scoped helper links and the helper view.
  - name: Notifications
    description: In-app notifications and delivery preferences.
  - name: Billing
    description: Plans, Stripe checkout and portal, webhook, sponsor codes.
  - name: Documents
    description: File upload, metadata, and download.
  - name: Account
    description: Data export and account deletion.
  - name: Extension
    description: API tokens and the two bearer routes the browser extension calls.
  - name: Scholarships
    description: Catalog search, listings, local submissions, reports, matches, and the board.
  - name: Colleges
    description: College search, the college list, application items, recommenders.
  - name: Essays
    description: Essays, versions, Quill reviews, comments, and the Story Bank.
  - name: Prep
    description: Test scores, superscores, retake analysis, study plans.
  - name: Impact
    description: Service hours, supervisor verification, activities.
  - name: Money
    description: Costs, award letters, offer comparison, loans, the public offer tool.
  - name: Aid
    description: FAFSA and CSS checklists and aid deadlines.
  - name: Plan
    description: This Week, weekly plans, and plan items.
  - name: Crew
    description: Conversations, messages, jobs, the job event stream, and action cards.
  - name: Admin
    description: Catalog review, listings, reports, college import, audit, research.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sc_session
      description: |
        Session cookie set by `GET /auth/verify`. HttpOnly, Secure, SameSite=Lax, 30 days.
        Writes also need `Origin` equal to the app origin.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sct_<43 URL-safe characters>
      description: |
        Extension API token from `POST /extension/tokens`. The security requirement lists
        the scope the route needs (`autofill` or `save_page`); a missing scope is 403.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudentId:
      name: studentId
      in: query
      required: false
      description: Read another student's data through a family share grant. Defaults to the caller.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Token:
      name: token
      in: path
      required: true
      description: The secret token from the emailed or shared link.
      schema:
        type: string
    ExtensionOrigin:
      name: Origin
      in: header
      required: false
      description: "`chrome-extension://<id>` gets CORS headers back."
      schema:
        type: string

  headers:
    SetSessionCookie:
      description: "`sc_session=<token>; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=2592000`"
      schema:
        type: string
    ClearSessionCookie:
      description: "`sc_session=; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=0`"
      schema:
        type: string
    ContentDisposition:
      description: "`attachment; filename=\"<ASCII fallback>\"; filename*=UTF-8''<RFC 8187 percent-encoded name>`. The encoded name also escapes `'`, `(`, `)`, and `*`."
      schema:
        type: string
    AllowOrigin:
      description: Echoes a `chrome-extension://` origin. Absent for other origins.
      schema:
        type: string
    RetryAfter:
      description: Seconds until the rate-limit window ends. Same value as `details.retryAfterSeconds`.
      schema:
        type: integer
        minimum: 1

  responses:
    NoContent:
      description: Done. No body.
    BadRequest:
      description: "`invalid_input`: validation failed (Zod issues in `details`) or a business rule was broken."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: invalid_input
              message: Check your input and try again
              details:
                - code: too_small
                  path: [title]
                  message: "Too small: expected string to have >=1 characters"
    Unauthenticated:
      description: "`unauthenticated`: no live session, or a bad or revoked token."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    LimitReached:
      description: "`limit_reached`: the monthly crew allowance is used up."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Forbidden:
      description: |
        `forbidden`: the Origin check failed, the token lacks the scope, or your role can't do this
        (for example a parent onboarding, or a student setting the family budget). Under-13 onboarding
        adds `details.reason: "underage"`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    NotFound:
      description: "`not_found`: doesn't exist, isn't yours, or isn't shared with you."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Conflict:
      description: "`conflict`: the write lost a race."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    PayloadTooLarge:
      description: "`invalid_input` with status 413: the request body passed its byte cap. Sent before the whole body is read."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: invalid_input
              message: Request body is too large
    RateLimited:
      description: |
        `rate_limited`: too many requests in the window. `Retry-After` gives the seconds until the
        window ends, also in `details.retryAfterSeconds`.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
          example:
            error:
              code: rate_limited
              message: Too many requests. Try again in 10 minutes.
              details:
                retryAfterSeconds: 600
    Internal:
      description: |
        `internal`: unexpected failure. Unhandled errors say "Something went wrong". A few configuration
        errors, such as billing not set up, carry their own message.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    # ---------- common ----------
    ErrorCode:
      type: string
      enum: [unauthenticated, forbidden, not_found, invalid_input, conflict, limit_reached, rate_limited, internal]
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            details:
              description: Present only when there's more to say. For validation errors, an array of Zod issues (`code`, `path`, `message`, ...).
    Usd:
      type: integer
      minimum: 0
      maximum: 10000000
      description: Whole US dollars.
    AwardYear:
      type: string
      pattern: "^\\d{4}-\\d{2}$"
      examples: ["2027-28"]
    USState:
      type: string
      enum: [AL, AK, AZ, AR, CA, CO, CT, DE, DC, FL, GA, HI, ID, IL, IN, IA, KS, KY, LA, ME, MD, MA, MI, MN, MS, MO, MT, NE, NV, NH, NJ, NM, NY, NC, ND, OH, OK, OR, PA, PR, RI, SC, SD, TN, TX, UT, VT, VA, WA, WV, WI, WY]
    Role:
      type: string
      enum: [student, parent, admin]
    ShareCategory:
      type: string
      enum: [deadlines, colleges, costs, scholarships, activities, essays, chats, stories, sensitive]
      description: |
        `sensitive` lets family members see sensitive match reasons on the board, the matches list,
        and listing detail. It never applies in chat (R2I-11). A category with no stored row uses
        its default.
    HelperScope:
      type: string
      enum: [deadlines, colleges, activities, stories, scholarships]
    CrewRole:
      type: string
      enum: [compass, scout, atlas, quill, aid, ledger, prep, impact]
    TaskStatus:
      type: string
      enum: [todo, done, skipped]

    # ---------- identity ----------
    UserStatus:
      type: string
      enum: [active, blocked_underage, deleted]
    User:
      type: object
      required: [id, email, displayName, role, birthYear, timeZone, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        birthYear: { type: [integer, "null"] }
        timeZone: { type: string, examples: [America/Chicago] }
        status: { $ref: "#/components/schemas/UserStatus" }
        createdAt: { type: string, format: date-time }
    MagicLinkRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    DevOutboxMessage:
      type: object
      required: [subject, text]
      properties:
        subject: { type: string }
        text: { type: string, description: Plain-text body. Sign-in links contain `token=<token>`. }

    # ---------- billing ----------
    PlanId:
      type: string
      enum: [free, family, season_pass]
    SubscriptionStatus:
      type: string
      enum: [active, past_due, canceled, expired]
    Subscription:
      type: object
      required: [plan, status, currentPeriodEnd, managedByStripe, sponsor]
      properties:
        plan: { $ref: "#/components/schemas/PlanId" }
        status: { $ref: "#/components/schemas/SubscriptionStatus" }
        currentPeriodEnd: { type: [string, "null"], format: date-time }
        managedByStripe: { type: boolean }
        sponsor: { type: [string, "null"] }
    UsageSummary:
      type: object
      required: [month, crewRequests, limit, costMicros]
      properties:
        month: { type: string, pattern: "^\\d{4}-\\d{2}$", examples: ["2026-10"] }
        crewRequests: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 0, description: "20 on free, 300 on family and season_pass." }
        costMicros: { type: integer, minimum: 0, description: Model cost in micro-dollars. }
    BillingView:
      type: object
      required: [subscription, usage]
      properties:
        subscription: { $ref: "#/components/schemas/Subscription" }
        usage: { $ref: "#/components/schemas/UsageSummary" }
    CheckoutInput:
      type: object
      additionalProperties: false
      required: [plan]
      properties:
        plan: { type: string, enum: [family, season_pass] }
    SponsorCodeInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 4, maxLength: 40 }
    UrlResponse:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, description: Stripe-hosted page to redirect to. }

    # ---------- documents and exports ----------
    DocumentKind:
      type: string
      enum: [award_letter, transcript, score_report, essay, resume, other]
    ParseStatus:
      type: string
      enum: [none, queued, parsing, parsed, failed]
    UploadMime:
      type: string
      enum: [application/pdf, text/plain, image/png, image/jpeg]
    DocumentMeta:
      type: object
      required: [id, kind, filename, mime, sizeBytes, parseStatus, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/DocumentKind" }
        filename: { type: string, minLength: 1, maxLength: 255 }
        mime: { $ref: "#/components/schemas/UploadMime" }
        sizeBytes: { type: integer, minimum: 1, maximum: 10485760 }
        parseStatus: { $ref: "#/components/schemas/ParseStatus" }
        uploadedAt: { type: string, format: date-time }
    DocumentUpload:
      type: object
      required: [kind, file]
      properties:
        kind: { $ref: "#/components/schemas/DocumentKind" }
        file:
          type: string
          contentMediaType: application/octet-stream
          description: "Up to 10 MB, not empty. Part type must be application/pdf, text/plain, image/png, or image/jpeg."
    ExportStatus:
      type: string
      enum: [queued, ready, failed]
    ExportRecord:
      type: object
      required: [id, status, createdAt, expiresAt, downloadUrl]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ExportStatus" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        downloadUrl: { type: [string, "null"] }

    # ---------- memory ----------
    FactSource:
      type: string
      enum: [user_stated, document, parent_shared, crew_inferred, system]
    FactVisibility:
      type: string
      enum: [crew, crew_family, scout_only, private]
      description: |
        For the eight profile keys, the crew sees a value only at `crew` or `crew_family` and the
        family crew only at `crew_family`. `scout_only` means scholarship matching only, and
        `private` hides it from the crew (R2I-10).
    FactStatus:
      type: string
      enum: [confirmed, candidate, rejected]
    FactKey:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,63}$"
      description: snake_case
    FactValue:
      oneOf:
        - { type: string, maxLength: 500 }
        - { type: number }
        - { type: boolean }
        - type: array
          maxItems: 20
          items: { type: string, maxLength: 100 }
    MemoryFact:
      type: object
      required: [id, key, value, valueText, source, sourceRef, visibility, status, createdAt, confirmedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        key: { $ref: "#/components/schemas/FactKey" }
        value: { $ref: "#/components/schemas/FactValue" }
        valueText: { type: string }
        source: { $ref: "#/components/schemas/FactSource" }
        sourceRef: { type: [string, "null"] }
        visibility: { $ref: "#/components/schemas/FactVisibility" }
        status: { $ref: "#/components/schemas/FactStatus" }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
    FactInput:
      type: object
      additionalProperties: false
      required: [key, value]
      properties:
        key: { $ref: "#/components/schemas/FactKey" }
        value: { $ref: "#/components/schemas/FactValue" }
        visibility:
          $ref: "#/components/schemas/FactVisibility"
          default: crew
        source:
          $ref: "#/components/schemas/FactSource"
          default: user_stated
        sourceRef: { type: [string, "null"], maxLength: 200, default: null }
    FactPatch:
      type: object
      additionalProperties: false
      properties:
        value: { $ref: "#/components/schemas/FactValue" }
        visibility: { $ref: "#/components/schemas/FactVisibility" }
    Decision:
      type: object
      required: [id, summary, rationale, decidedAt, sourceMessageId]
      properties:
        id: { type: string, format: uuid }
        summary: { type: string }
        rationale: { type: string }
        decidedAt: { type: string, format: date-time }
        sourceMessageId: { type: [string, "null"], format: uuid }
    DecisionInput:
      type: object
      additionalProperties: false
      required: [summary]
      properties:
        summary: { type: string, minLength: 1, maxLength: 200 }
        rationale: { type: string, maxLength: 500, default: "" }
    IncomeRange:
      type: string
      enum: [under_30k, "30_48k", "48_75k", "75_110k", over_110k]
    SensitiveKind:
      type: string
      enum: [first_gen, income_range, heritage, disability, religion, military_family, foster_care, noncitizen_filter]
    SensitiveFactInput:
      type: object
      additionalProperties: false
      required: [kind, enabled]
      description: |
        `income_range` takes an IncomeRange value; `heritage` and `religion` take a list;
        every other kind takes `null`. The server rejects other combinations with 400.
      properties:
        kind: { $ref: "#/components/schemas/SensitiveKind" }
        enabled: { type: boolean }
        value:
          default: null
          oneOf:
            - $ref: "#/components/schemas/IncomeRange"
            - type: array
              maxItems: 5
              items: { type: string, minLength: 1, maxLength: 60 }
            - type: "null"
    SensitiveFactSummary:
      type: object
      required: [kind, enabled, hasValue, displayValue, sharedByParent]
      properties:
        kind: { $ref: "#/components/schemas/SensitiveKind" }
        enabled: { type: boolean }
        hasValue: { type: boolean }
        displayValue: { type: [string, "null"] }
        sharedByParent: { type: boolean }
    ShareIncomeInput:
      type: object
      additionalProperties: false
      required: [studentId, range]
      properties:
        studentId: { type: string, format: uuid }
        range: { $ref: "#/components/schemas/IncomeRange" }

    # ---------- family ----------
    FamilyMemberRole:
      type: string
      enum: [student, parent]
    FamilyView:
      type: object
      required: [id, name, myRole, members, pendingInvites]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        myRole: { $ref: "#/components/schemas/FamilyMemberRole" }
        members:
          type: array
          items:
            type: object
            required: [userId, displayName, email, memberRole, joinedAt]
            properties:
              userId: { type: string, format: uuid }
              displayName: { type: string }
              email: { type: string, format: email }
              memberRole: { $ref: "#/components/schemas/FamilyMemberRole" }
              joinedAt: { type: string, format: date-time }
        pendingInvites:
          type: array
          items:
            type: object
            required: [id, email, expiresAt]
            properties:
              id: { type: string, format: uuid }
              email: { type: string, format: email }
              expiresAt: { type: string, format: date-time }
    InviteInput:
      type: object
      additionalProperties: false
      required: [email]
      description: Student-only invitations to a parent; unknown fields are rejected.
      properties:
        email: { type: string, format: email, maxLength: 254 }
    AcceptInviteInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
    InvitePreview:
      type: object
      required: [inviterFirstName, memberRole, expiresAt]
      description: What `/family/join` shows before sign-in (D37). Never includes the invitee's email.
      properties:
        inviterFirstName: { type: string }
        memberRole: { $ref: "#/components/schemas/FamilyMemberRole" }
        expiresAt: { type: string, format: date-time }
    ShareSettings:
      type: object
      required: [studentId, familyId, categories]
      properties:
        studentId: { type: string, format: uuid }
        familyId: { type: string, format: uuid }
        categories:
          type: object
          description: One boolean per share category; every category is present.
          required: [deadlines, colleges, costs, scholarships, activities, essays, chats, stories, sensitive]
          propertyNames: { $ref: "#/components/schemas/ShareCategory" }
          additionalProperties: { type: boolean }
    ShareSettingsInput:
      type: object
      additionalProperties: false
      required: [categories]
      properties:
        categories:
          type: object
          description: Only the categories to change.
          propertyNames: { $ref: "#/components/schemas/ShareCategory" }
          additionalProperties: { type: boolean }
    FamilyBudget:
      type: object
      required: [familyId, annualUsd, sharedById, updatedAt]
      properties:
        familyId: { type: string, format: uuid }
        annualUsd: { $ref: "#/components/schemas/Usd" }
        sharedById: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    FamilyBudgetInput:
      type: object
      additionalProperties: false
      required: [annualUsd]
      properties:
        annualUsd: { type: integer, minimum: 0, maximum: 500000 }
    FamilyTaskKind:
      type: string
      enum: [fafsa_contributor, css_contributor, share_income_range, share_budget, review_costs, custom]
    FamilyTask:
      type: object
      required: [id, familyId, assigneeId, assigneeName, studentId, kind, title, detail, status, dueOn, createdAt, completedAt]
      properties:
        id: { type: string, format: uuid }
        familyId: { type: string, format: uuid }
        assigneeId: { type: string, format: uuid }
        assigneeName: { type: string }
        studentId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/FamilyTaskKind" }
        title: { type: string }
        detail: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        dueOn: { type: [string, "null"], format: date }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    FamilyTaskPatch:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/TaskStatus" }

    # ---------- scholarships ----------
    CatalogStatus:
      type: string
      enum: [draft, published, stale, retired, flagged]
    ListingVisibility:
      type: string
      enum: [public, submitter_only]
    ScamFlag:
      type: string
      enum: [application_fee, guaranteed_award, bank_or_card_request, ssn_request, sweepstakes, unsolicited_winner, pay_for_info]
    LocalArea:
      type: object
      additionalProperties: false
      description: "`counties` and `cities` default to `[]` in requests and are always present in responses."
      required: [national, state]
      properties:
        national: { type: boolean }
        state:
          oneOf:
            - $ref: "#/components/schemas/USState"
            - type: "null"
        counties:
          type: array
          maxItems: 50
          default: []
          items: { type: string, minLength: 1, maxLength: 100 }
        cities:
          type: array
          maxItems: 50
          default: []
          items: { type: string, minLength: 1, maxLength: 100 }
    EligibilityRule:
      oneOf:
        - $ref: "#/components/schemas/EligibilityStateIn"
        - $ref: "#/components/schemas/EligibilityCountyIn"
        - $ref: "#/components/schemas/EligibilityCityIn"
        - $ref: "#/components/schemas/EligibilityClassYearIn"
        - $ref: "#/components/schemas/EligibilityGpaMin"
        - $ref: "#/components/schemas/EligibilityMajorAny"
        - $ref: "#/components/schemas/EligibilityInterestAny"
        - $ref: "#/components/schemas/EligibilityFirstGen"
        - $ref: "#/components/schemas/EligibilityIncomeMax"
        - $ref: "#/components/schemas/EligibilityHeritageAny"
        - $ref: "#/components/schemas/EligibilityDisability"
        - $ref: "#/components/schemas/EligibilityReligionAny"
        - $ref: "#/components/schemas/EligibilityMilitaryFamily"
        - $ref: "#/components/schemas/EligibilityFosterCare"
        - $ref: "#/components/schemas/EligibilityCitizenshipRequired"
        - $ref: "#/components/schemas/EligibilityTestMin"
        - $ref: "#/components/schemas/EligibilityServiceHoursMin"
        - $ref: "#/components/schemas/EligibilityCustom"
      discriminator:
        propertyName: type
        mapping:
          state_in: "#/components/schemas/EligibilityStateIn"
          county_in: "#/components/schemas/EligibilityCountyIn"
          city_in: "#/components/schemas/EligibilityCityIn"
          class_year_in: "#/components/schemas/EligibilityClassYearIn"
          gpa_min: "#/components/schemas/EligibilityGpaMin"
          major_any: "#/components/schemas/EligibilityMajorAny"
          interest_any: "#/components/schemas/EligibilityInterestAny"
          first_gen: "#/components/schemas/EligibilityFirstGen"
          income_max: "#/components/schemas/EligibilityIncomeMax"
          heritage_any: "#/components/schemas/EligibilityHeritageAny"
          disability: "#/components/schemas/EligibilityDisability"
          religion_any: "#/components/schemas/EligibilityReligionAny"
          military_family: "#/components/schemas/EligibilityMilitaryFamily"
          foster_care: "#/components/schemas/EligibilityFosterCare"
          citizenship_required: "#/components/schemas/EligibilityCitizenshipRequired"
          test_min: "#/components/schemas/EligibilityTestMin"
          service_hours_min: "#/components/schemas/EligibilityServiceHoursMin"
          custom: "#/components/schemas/EligibilityCustom"
    EligibilityStateIn:
      type: object
      additionalProperties: false
      required: [type, states]
      properties:
        type: { const: state_in }
        states: { type: array, minItems: 1, items: { $ref: "#/components/schemas/USState" } }
    EligibilityCountyIn:
      type: object
      additionalProperties: false
      required: [type, state, counties]
      properties:
        type: { const: county_in }
        state: { $ref: "#/components/schemas/USState" }
        counties: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    EligibilityCityIn:
      type: object
      additionalProperties: false
      required: [type, state, cities]
      properties:
        type: { const: city_in }
        state: { $ref: "#/components/schemas/USState" }
        cities: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    EligibilityClassYearIn:
      type: object
      additionalProperties: false
      required: [type, years]
      properties:
        type: { const: class_year_in }
        years: { type: array, minItems: 1, items: { type: integer, minimum: 2020, maximum: 2040 } }
    EligibilityGpaMin:
      type: object
      additionalProperties: false
      required: [type, min]
      properties:
        type: { const: gpa_min }
        min: { type: number, minimum: 0, maximum: 5 }
    EligibilityMajorAny:
      type: object
      additionalProperties: false
      required: [type, majors]
      properties:
        type: { const: major_any }
        majors: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    EligibilityInterestAny:
      type: object
      additionalProperties: false
      required: [type, interests]
      properties:
        type: { const: interest_any }
        interests: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    EligibilityFirstGen:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { const: first_gen }
    EligibilityIncomeMax:
      type: object
      additionalProperties: false
      required: [type, maxRange]
      properties:
        type: { const: income_max }
        maxRange: { $ref: "#/components/schemas/IncomeRange" }
    EligibilityHeritageAny:
      type: object
      additionalProperties: false
      required: [type, values]
      properties:
        type: { const: heritage_any }
        values: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    EligibilityDisability:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { const: disability }
    EligibilityReligionAny:
      type: object
      additionalProperties: false
      required: [type, values]
      properties:
        type: { const: religion_any }
        values: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    EligibilityMilitaryFamily:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { const: military_family }
    EligibilityFosterCare:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { const: foster_care }
    EligibilityCitizenshipRequired:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { const: citizenship_required }
    EligibilityTestMin:
      type: object
      additionalProperties: false
      required: [type, test, min]
      properties:
        type: { const: test_min }
        test: { type: string, enum: [ACT, SAT] }
        min: { type: integer, minimum: 1 }
    EligibilityServiceHoursMin:
      type: object
      additionalProperties: false
      required: [type, hours]
      properties:
        type: { const: service_hours_min }
        hours: { type: integer, minimum: 1 }
    EligibilityCustom:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type: { const: custom }
        text: { type: string, minLength: 1, maxLength: 300 }
    EssayRequirement:
      type: object
      additionalProperties: false
      required: [prompt, wordLimit]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 4000 }
        wordLimit: { type: [integer, "null"], minimum: 1, maximum: 5000 }
    ScholarshipRequirements:
      type: object
      additionalProperties: false
      required: [essays, recommendations, transcript, serviceHours, other]
      properties:
        essays: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/EssayRequirement" } }
        recommendations: { type: integer, minimum: 0, maximum: 10 }
        transcript: { type: boolean }
        serviceHours: { type: [integer, "null"], minimum: 1 }
        other: { type: array, maxItems: 10, items: { type: string, maxLength: 200 } }
    Scholarship:
      type: object
      required: [id, slug, name, provider, url, sourceUrl, amountMinUsd, amountMaxUsd, renewable, renewalTerms, deadline, cycle, localArea, eligibility, requirements, status, visibility, submittedById, scamFlags, estMinutes, verifiedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        provider: { type: string }
        url: { type: string }
        sourceUrl: { type: string }
        amountMinUsd: { $ref: "#/components/schemas/Usd" }
        amountMaxUsd: { $ref: "#/components/schemas/Usd" }
        renewable: { type: boolean }
        renewalTerms: { type: string }
        deadline: { type: [string, "null"], format: date }
        cycle: { type: string }
        localArea: { $ref: "#/components/schemas/LocalArea" }
        eligibility: { type: array, items: { $ref: "#/components/schemas/EligibilityRule" } }
        requirements: { $ref: "#/components/schemas/ScholarshipRequirements" }
        status: { $ref: "#/components/schemas/CatalogStatus" }
        visibility: { $ref: "#/components/schemas/ListingVisibility" }
        submittedById: { type: [string, "null"], format: uuid }
        scamFlags: { type: array, items: { $ref: "#/components/schemas/ScamFlag" } }
        estMinutes: { type: integer }
        verifiedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ScholarshipSummary:
      type: object
      required: [id, slug, name, provider, amountMinUsd, amountMaxUsd, renewable, deadline, localLabel, status, verifiedAt, scamFlags, unverified, estMinutes]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        provider: { type: string }
        amountMinUsd: { $ref: "#/components/schemas/Usd" }
        amountMaxUsd: { $ref: "#/components/schemas/Usd" }
        renewable: { type: boolean }
        deadline: { type: [string, "null"], format: date }
        localLabel: { type: string }
        status: { $ref: "#/components/schemas/CatalogStatus" }
        verifiedAt: { type: [string, "null"], format: date-time }
        scamFlags: { type: array, items: { $ref: "#/components/schemas/ScamFlag" } }
        unverified: { type: boolean }
        estMinutes: { type: integer }
    ApplicationStage:
      type: string
      enum: [matched, planned, drafting, submitted, won, lost, skipped]
    MatchReason:
      type: object
      required: [code, text, sensitive]
      properties:
        code: { type: string, maxLength: 40 }
        text: { type: string, maxLength: 140 }
        sensitive: { type: boolean }
    ScholarshipApplication:
      type: object
      required: [id, scholarshipId, stage, matchReasons, fitScore, estMinutes, submittedAt, outcomeUsd, outcomeRenewable, outcomeAt, thankYouSent, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        scholarshipId: { type: string, format: uuid }
        stage: { $ref: "#/components/schemas/ApplicationStage" }
        matchReasons: { type: array, items: { $ref: "#/components/schemas/MatchReason" } }
        fitScore: { type: integer, minimum: 0, maximum: 100 }
        estMinutes: { type: integer }
        submittedAt: { type: [string, "null"], format: date-time }
        outcomeUsd: { type: [integer, "null"], minimum: 0 }
        outcomeRenewable: { type: [boolean, "null"] }
        outcomeAt: { type: [string, "null"], format: date-time }
        thankYouSent: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ScholarshipDetail:
      allOf:
        - $ref: "#/components/schemas/Scholarship"
        - type: object
          required: [application, stale]
          properties:
            application:
              description: The caller's application, or null (always null when signed out).
              oneOf:
                - $ref: "#/components/schemas/ScholarshipApplication"
                - type: "null"
            stale: { type: boolean }
    ApplicationPatch:
      type: object
      additionalProperties: false
      properties:
        stage: { $ref: "#/components/schemas/ApplicationStage" }
        outcomeUsd: { type: [integer, "null"], minimum: 0, maximum: 10000000 }
        outcomeRenewable: { type: [boolean, "null"] }
        thankYouSent: { type: boolean }
    SaveScholarshipInput:
      type: object
      additionalProperties: false
      required: [scholarshipId]
      description: Route-local body for saving a listing to the board.
      properties:
        scholarshipId: { type: string, format: uuid }
    Match:
      type: object
      required: [scholarship, fitScore, valuePerHour, estMinutes, reasons, unknowns, reuseStoryIds, daysUntilDeadline, applicationId, stage]
      properties:
        scholarship: { $ref: "#/components/schemas/ScholarshipSummary" }
        fitScore: { type: integer, minimum: 0, maximum: 100 }
        valuePerHour: { type: number, minimum: 0 }
        estMinutes: { type: integer }
        reasons: { type: array, items: { $ref: "#/components/schemas/MatchReason" } }
        unknowns: { type: array, items: { type: string } }
        reuseStoryIds: { type: array, items: { type: string, format: uuid } }
        daysUntilDeadline: { type: [integer, "null"] }
        applicationId: { type: [string, "null"], format: uuid }
        stage:
          oneOf:
            - $ref: "#/components/schemas/ApplicationStage"
            - type: "null"
    BoardCard:
      type: object
      required: [application, scholarship, reasons, reuseStoryTitle, progress, daysUntilDeadline]
      properties:
        application: { $ref: "#/components/schemas/ScholarshipApplication" }
        scholarship: { $ref: "#/components/schemas/ScholarshipSummary" }
        reasons: { type: array, items: { $ref: "#/components/schemas/MatchReason" } }
        reuseStoryTitle: { type: [string, "null"] }
        progress: { type: [number, "null"], minimum: 0, maximum: 1 }
        daysUntilDeadline: { type: [integer, "null"] }
    Board:
      type: object
      required: [matched, working, submitted, won, lostOrSkipped, flagged, totals, privateCount]
      properties:
        privateCount: { type: integer, minimum: 0, description: Sensitive matches withheld from non-owner views. }
        matched: { type: array, items: { $ref: "#/components/schemas/BoardCard" } }
        working: { type: array, items: { $ref: "#/components/schemas/BoardCard" } }
        submitted: { type: array, items: { $ref: "#/components/schemas/BoardCard" } }
        won: { type: array, items: { $ref: "#/components/schemas/BoardCard" } }
        lostOrSkipped: { type: array, items: { $ref: "#/components/schemas/BoardCard" } }
        flagged:
          type: array
          items:
            type: object
            required: [scholarship, reason]
            properties:
              scholarship: { $ref: "#/components/schemas/ScholarshipSummary" }
              reason: { type: string }
        totals:
          type: object
          required: [inPlayUsd, wonUsd, dueThisMonth]
          properties:
            inPlayUsd: { $ref: "#/components/schemas/Usd" }
            wonUsd: { $ref: "#/components/schemas/Usd" }
            dueThisMonth: { type: integer, minimum: 0 }
    LocalSubmissionInput:
      type: object
      additionalProperties: false
      required: [url, name]
      properties:
        url: { type: string, format: uri, maxLength: 2000 }
        name: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: string, maxLength: 1000, default: "" }
    ReportReason:
      type: string
      enum: [wrong_deadline, dead_link, scam, wrong_amount, other]
    ReportInput:
      type: object
      additionalProperties: false
      required: [reason]
      description: "`scholarshipId` is taken from the path and overrides any value in the body."
      properties:
        scholarshipId: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/ReportReason" }
        details: { type: string, maxLength: 1000, default: "" }
    SweepSummary:
      type: object
      required: [ranAt, newMatches, totalUsd, reuseCount, hiddenScams]
      properties:
        ranAt: { type: string, format: date-time }
        newMatches: { type: integer, minimum: 0 }
        totalUsd: { $ref: "#/components/schemas/Usd" }
        reuseCount: { type: integer, minimum: 0 }
        hiddenScams: { type: integer, minimum: 0 }
    PageScholarship:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Scholarship" } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, description: Always 50. }
        total: { type: integer, minimum: 0 }
    PageScholarshipSummary:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ScholarshipSummary" } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }

    # ---------- colleges ----------
    CollegeId:
      type: string
      minLength: 1
      maxLength: 12
      description: IPEDS unit ID as a string.
      examples: ["228778"]
    CollegeControl:
      type: string
      enum: [public, private_nonprofit, private_forprofit]
    TestPolicy:
      type: string
      enum: [required, optional, blind, unknown]
    OutsidePolicy:
      type: string
      enum: [added_on_top, reduces_loans_first, may_reduce_grant, unknown]
    NetPriceByIncome:
      type: object
      required: [overall, under_30k, "30_48k", "48_75k", "75_110k", over_110k]
      properties:
        overall: { type: [integer, "null"], minimum: 0, default: null }
        under_30k: { type: [integer, "null"], minimum: 0, default: null }
        "30_48k": { type: [integer, "null"], minimum: 0, default: null }
        "48_75k": { type: [integer, "null"], minimum: 0, default: null }
        "75_110k": { type: [integer, "null"], minimum: 0, default: null }
        over_110k: { type: [integer, "null"], minimum: 0, default: null }
    MeritTier:
      type: object
      required: [label, minGpa, minAct, minSat, annualUsd, renewalGpa]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        minGpa: { type: [number, "null"], minimum: 0, maximum: 5 }
        minAct: { type: [integer, "null"], minimum: 1, maximum: 36 }
        minSat: { type: [integer, "null"], minimum: 400, maximum: 1600 }
        annualUsd: { $ref: "#/components/schemas/Usd" }
        renewalGpa: { type: [number, "null"], minimum: 0, maximum: 5 }
    CollegeDeadlines:
      type: object
      required: [ED, EA, REA, RD, rolling]
      properties:
        ED: { type: [string, "null"], format: date, default: null }
        EA: { type: [string, "null"], format: date, default: null }
        REA: { type: [string, "null"], format: date, default: null }
        RD: { type: [string, "null"], format: date, default: null }
        rolling: { type: boolean }
    CollegeRequirements:
      type: object
      required: [supplements, teacherRecs, counselorRec, applicationFeeUsd, feeWaiverAvailable, portfolio, interview]
      properties:
        supplements: { type: array, maxItems: 10, default: [], items: { $ref: "#/components/schemas/EssayRequirement" } }
        teacherRecs: { type: integer, minimum: 0, maximum: 5, default: 0 }
        counselorRec: { type: boolean, default: false }
        applicationFeeUsd: { type: [integer, "null"], minimum: 0, default: null }
        feeWaiverAvailable: { type: boolean, default: false }
        portfolio: { type: boolean, default: false }
        interview: { type: string, enum: [required, optional, none], default: none }
    College:
      type: object
      required: [id, name, state, city, control, admitRate, costOfAttendanceUsd, netPriceByIncome, testPolicy, superscore, cssProfileRequired, outsidePolicy, meritTiers, deadlines, requirements, aidPriorityDate, sourceUrl, verifiedAt]
      properties:
        id: { $ref: "#/components/schemas/CollegeId" }
        name: { type: string }
        state: { type: string }
        city: { type: string }
        control: { $ref: "#/components/schemas/CollegeControl" }
        admitRate: { type: [number, "null"], minimum: 0, maximum: 1 }
        costOfAttendanceUsd: { type: [integer, "null"], minimum: 0 }
        netPriceByIncome: { $ref: "#/components/schemas/NetPriceByIncome" }
        testPolicy: { $ref: "#/components/schemas/TestPolicy" }
        superscore: { type: [boolean, "null"] }
        cssProfileRequired: { type: boolean }
        outsidePolicy: { $ref: "#/components/schemas/OutsidePolicy" }
        meritTiers: { type: array, items: { $ref: "#/components/schemas/MeritTier" } }
        deadlines: { $ref: "#/components/schemas/CollegeDeadlines" }
        requirements: { $ref: "#/components/schemas/CollegeRequirements" }
        aidPriorityDate: { type: [string, "null"], format: date }
        sourceUrl: { type: string }
        verifiedAt: { type: [string, "null"], format: date-time }
    CollegeSummary:
      type: object
      required: [id, name, state, city, control, admitRate, costOfAttendanceUsd, testPolicy]
      properties:
        id: { $ref: "#/components/schemas/CollegeId" }
        name: { type: string }
        state: { type: string }
        city: { type: string }
        control: { $ref: "#/components/schemas/CollegeControl" }
        admitRate: { type: [number, "null"], minimum: 0, maximum: 1 }
        costOfAttendanceUsd: { type: [integer, "null"], minimum: 0 }
        testPolicy: { $ref: "#/components/schemas/TestPolicy" }
    PageCollegeSummary:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CollegeSummary" } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    Fit:
      type: string
      enum: [reach, target, likely]
    AppPlan:
      type: string
      enum: [ED, EA, REA, RD, rolling]
    AppStatus:
      type: string
      enum: [researching, applying, submitted, admitted, waitlisted, denied, enrolled, withdrawn]
    CollegeListEntry:
      type: object
      required: [id, collegeId, college, fit, plan, status, season, deadline, itemsDone, itemsTotal, gapUsd, outsidePolicy, testPolicy, createdAt]
      properties:
        id: { type: string, format: uuid }
        collegeId: { type: string }
        college: { $ref: "#/components/schemas/CollegeSummary" }
        fit: { $ref: "#/components/schemas/Fit" }
        plan: { $ref: "#/components/schemas/AppPlan" }
        status: { $ref: "#/components/schemas/AppStatus" }
        season: { type: string, examples: ["2026-27"] }
        deadline: { type: [string, "null"], format: date }
        itemsDone: { type: integer, minimum: 0 }
        itemsTotal: { type: integer, minimum: 0 }
        gapUsd: { type: [integer, "null"], minimum: 0 }
        outsidePolicy: { $ref: "#/components/schemas/OutsidePolicy" }
        testPolicy: { $ref: "#/components/schemas/TestPolicy" }
        createdAt: { type: string, format: date-time }
    CollegeListInput:
      type: object
      additionalProperties: false
      required: [collegeId, fit, plan]
      properties:
        collegeId: { $ref: "#/components/schemas/CollegeId" }
        fit: { $ref: "#/components/schemas/Fit" }
        plan: { $ref: "#/components/schemas/AppPlan" }
    CollegeListPatch:
      type: object
      additionalProperties: false
      properties:
        fit: { $ref: "#/components/schemas/Fit" }
        plan: { $ref: "#/components/schemas/AppPlan" }
        status: { $ref: "#/components/schemas/AppStatus" }
    ArchiveResult:
      type: object
      required: [archived]
      properties:
        archived: { type: integer, minimum: 0, description: Number of college list entries archived. }
    ApplicationItemKind:
      type: string
      enum: [form, transcript, counselor_rec, teacher_rec, supplement, test_scores, portfolio, interview, fee_or_waiver, css_profile]
    ItemStatus:
      type: string
      enum: [todo, in_progress, done, not_needed]
    ApplicationItem:
      type: object
      required: [id, collegeListId, kind, label, status, dueOn, essayId, updatedAt]
      properties:
        id: { type: string, format: uuid }
        collegeListId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ApplicationItemKind" }
        label: { type: string }
        status: { $ref: "#/components/schemas/ItemStatus" }
        dueOn: { type: [string, "null"], format: date }
        essayId: { type: [string, "null"], format: uuid }
        updatedAt: { type: string, format: date-time }
    ApplicationItemPatch:
      type: object
      additionalProperties: false
      properties:
        status: { $ref: "#/components/schemas/ItemStatus" }
        essayId: { type: [string, "null"], format: uuid }
    Recommender:
      type: object
      required: [id, name, email, relationship, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        relationship: { type: string }
        createdAt: { type: string, format: date-time }
    RecommenderInput:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        relationship: { type: string, maxLength: 120, default: "" }
    RecStatus:
      type: string
      enum: [draft, requested, confirmed, submitted, declined]
    RecRequest:
      type: object
      required: [id, recommenderId, collegeListId, scholarshipApplicationId, helperLinkId, status, requestedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        recommenderId: { type: string, format: uuid }
        collegeListId: { type: [string, "null"], format: uuid }
        scholarshipApplicationId: { type: [string, "null"], format: uuid }
        helperLinkId: { type: [string, "null"], format: uuid }
        status: { $ref: "#/components/schemas/RecStatus" }
        requestedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
    RecRequestInput:
      type: object
      additionalProperties: false
      required: [recommenderId]
      properties:
        recommenderId: { type: string, format: uuid }
        collegeListId: { type: [string, "null"], format: uuid, default: null }
        scholarshipApplicationId: { type: [string, "null"], format: uuid, default: null }
        message: { type: string, maxLength: 1000, default: "" }
    RecRequestPatch:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [confirmed, submitted, declined] }

    # ---------- profile ----------
    Profile:
      type: object
      required: [userId, classYear, highSchool, state, county, city, gpaUnweighted, gpaWeighted, intendedMajors, interests, onboardingCompletedAt, updatedAt]
      properties:
        userId: { type: string, format: uuid }
        classYear: { type: [integer, "null"] }
        highSchool: { type: string }
        state: { type: string, description: "Two-letter state code, or empty." }
        county: { type: string }
        city: { type: string }
        gpaUnweighted: { type: [number, "null"], minimum: 0, maximum: 5 }
        gpaWeighted: { type: [number, "null"], minimum: 0, maximum: 6 }
        intendedMajors: { type: array, items: { type: string } }
        interests: { type: array, items: { type: string } }
        onboardingCompletedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        classYear: { type: [integer, "null"], minimum: 2020, maximum: 2040 }
        highSchool: { type: string, maxLength: 200 }
        state:
          oneOf:
            - $ref: "#/components/schemas/USState"
            - const: ""
        county: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 100 }
        gpaUnweighted: { type: [number, "null"], minimum: 0, maximum: 5 }
        gpaWeighted: { type: [number, "null"], minimum: 0, maximum: 6 }
        intendedMajors: { type: array, maxItems: 5, items: { type: string, minLength: 1, maxLength: 80 } }
        interests: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 60 } }
        timeZone: { type: string, minLength: 3, maxLength: 60 }
    OnboardingInput:
      type: object
      additionalProperties: false
      required: [displayName, birthYear, classYear, highSchool, state, county, gpaUnweighted, intendedMajors, interests]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        birthYear: { type: integer, minimum: 1900, maximum: 2030, description: Users under 13 are blocked. }
        classYear: { type: integer, minimum: 2020, maximum: 2040 }
        highSchool: { type: string, minLength: 1, maxLength: 200 }
        state: { $ref: "#/components/schemas/USState" }
        county: { type: string, minLength: 1, maxLength: 100 }
        city: { type: string, maxLength: 100, default: "" }
        gpaUnweighted: { type: [number, "null"], minimum: 0, maximum: 5 }
        intendedMajors: { type: array, maxItems: 5, items: { type: string, minLength: 1, maxLength: 80 } }
        interests: { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 60 } }
        timeZone: { type: string, minLength: 3, maxLength: 60, default: America/Chicago }
        collegeIds: { type: array, maxItems: 15, default: [], items: { $ref: "#/components/schemas/CollegeId" } }
        sensitive: { type: array, maxItems: 8, default: [], items: { $ref: "#/components/schemas/SensitiveFactInput" } }
    MeResponse:
      type: object
      required: [user, profile, onboardingComplete, family, plan]
      properties:
        user: { $ref: "#/components/schemas/User" }
        profile:
          oneOf:
            - $ref: "#/components/schemas/Profile"
            - type: "null"
        onboardingComplete: { type: boolean, description: Always true for parents and admins. }
        family:
          oneOf:
            - type: object
              required: [id, role]
              properties:
                id: { type: string, format: uuid }
                role: { $ref: "#/components/schemas/FamilyMemberRole" }
            - type: "null"
        plan: { $ref: "#/components/schemas/PlanId" }

    # ---------- essays and stories ----------
    EssayTarget:
      type: string
      enum: [college, scholarship, general]
    EssayStatus:
      type: string
      enum: [drafting, ready, submitted]
    Essay:
      type: object
      required: [id, title, prompt, wordLimit, charLimit, targetType, targetCollegeId, targetScholarshipId, currentVersion, latestWordCount, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        prompt: { type: string }
        wordLimit: { type: [integer, "null"] }
        charLimit: { type: [integer, "null"] }
        targetType: { $ref: "#/components/schemas/EssayTarget" }
        targetCollegeId: { type: [string, "null"] }
        targetScholarshipId: { type: [string, "null"], format: uuid }
        currentVersion: { type: integer, minimum: 0 }
        latestWordCount:
          type: [integer, "null"]
          minimum: 0
          description: Word count of the current version; null before the first save (D34).
        status: { $ref: "#/components/schemas/EssayStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EssayInput:
      type: object
      additionalProperties: false
      required: [title, prompt]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        prompt: { type: string, maxLength: 4000 }
        wordLimit: { type: [integer, "null"], minimum: 1, maximum: 5000, default: null }
        charLimit: { type: [integer, "null"], minimum: 1, maximum: 20000, default: null }
        targetType:
          $ref: "#/components/schemas/EssayTarget"
          default: general
        targetCollegeId: { type: [string, "null"], maxLength: 12, default: null }
        targetScholarshipId: { type: [string, "null"], format: uuid, default: null }
    EssayPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one field (R2P-14).
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        prompt: { type: string, maxLength: 4000 }
        status: { $ref: "#/components/schemas/EssayStatus" }
    CommentAuthor:
      type: string
      enum: [quill, helper, user]
    CommentKind:
      type: string
      enum: [question, structure, clarity, prompt_fit, word_budget]
    EssayComment:
      type: object
      required: [id, essayId, version, author, kind, quote, occurrence, body, resolvedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        essayId: { type: string, format: uuid }
        version: { type: integer }
        author: { $ref: "#/components/schemas/CommentAuthor" }
        kind: { $ref: "#/components/schemas/CommentKind" }
        quote: { type: string, description: Exact text from the essay the comment anchors to. }
        occurrence: { type: integer, minimum: 1, description: Which occurrence of `quote` (1-based). }
        body: { type: string }
        resolvedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    EssayWithBody:
      allOf:
        - $ref: "#/components/schemas/Essay"
        - type: object
          required: [body, wordCount, comments, targetLabel]
          properties:
            body: { type: string }
            wordCount: { type: integer, minimum: 0 }
            comments: { type: array, items: { $ref: "#/components/schemas/EssayComment" } }
            targetLabel: { type: [string, "null"] }
    EssayVersion:
      type: object
      required: [id, essayId, version, body, wordCount, authorId, createdAt]
      properties:
        id: { type: string, format: uuid }
        essayId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        body: { type: string }
        wordCount: { type: integer, minimum: 0 }
        authorId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    SaveVersionInput:
      type: object
      additionalProperties: false
      required: [body, baseVersion]
      properties:
        body: { type: string, maxLength: 50000 }
        baseVersion: { type: integer, minimum: 0, description: The version the edit started from. A stale value is 409. }
    Story:
      type: object
      required: [id, title, moment, themes, evidence, summary, createdAt, updatedAt, archivedAt, uses]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        moment: { type: string }
        themes: { type: array, items: { type: string } }
        evidence: { type: string }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }
        uses:
          type: array
          items:
            type: object
            required: [essayId, essayTitle, collegeId, scholarshipId, usedAt]
            properties:
              essayId: { type: string, format: uuid }
              essayTitle: { type: string }
              collegeId: { type: [string, "null"] }
              scholarshipId: { type: [string, "null"], format: uuid }
              usedAt: { type: string, format: date-time }
    StoryInput:
      type: object
      additionalProperties: false
      required: [title, moment]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        moment: { type: string, minLength: 1, maxLength: 4000 }
        themes: { type: array, maxItems: 8, default: [], items: { type: string, minLength: 1, maxLength: 40 } }
        evidence: { type: string, maxLength: 2000, default: "" }
        summary: { type: string, maxLength: 400, default: "" }
    StoryPatch:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        moment: { type: string, minLength: 1, maxLength: 4000 }
        themes: { type: array, maxItems: 8, items: { type: string, minLength: 1, maxLength: 40 } }
        evidence: { type: string, maxLength: 2000 }
        summary: { type: string, maxLength: 400 }
    StoryUse:
      type: object
      required: [id, storyId, essayId, collegeId, scholarshipId, usedAt]
      properties:
        id: { type: string, format: uuid }
        storyId: { type: string, format: uuid }
        essayId: { type: string, format: uuid }
        collegeId: { type: [string, "null"] }
        scholarshipId: { type: [string, "null"], format: uuid }
        usedAt: { type: string, format: date-time }
    LinkStoryInput:
      type: object
      additionalProperties: false
      required: [storyId, essayId]
      properties:
        storyId: { type: string, format: uuid }
        essayId: { type: string, format: uuid }
    StoryReuseCheckInput:
      type: object
      additionalProperties: false
      required: [storyId]
      properties:
        storyId: { type: string, format: uuid }
        collegeId: { type: string, maxLength: 12 }
        scholarshipId: { type: string, format: uuid }
    StoryReuseCheck:
      type: object
      required: [storyId, alreadyUsedForTarget, priorUses, message]
      properties:
        storyId: { type: string, format: uuid }
        alreadyUsedForTarget: { type: boolean }
        priorUses: { type: integer, minimum: 0 }
        message: { type: [string, "null"] }

    # ---------- prep ----------
    TestKind:
      type: string
      enum: [ACT, SAT, PSAT]
    TestScore:
      type: object
      required: [id, test, takenOn, official, composite, sections, createdAt]
      properties:
        id: { type: string, format: uuid }
        test: { $ref: "#/components/schemas/TestKind" }
        takenOn: { type: string, format: date }
        official: { type: boolean }
        composite: { type: integer }
        sections: { type: object, additionalProperties: { type: integer } }
        createdAt: { type: string, format: date-time }
    TestScoreInput:
      type: object
      additionalProperties: false
      required: [test, takenOn, official, composite, sections]
      description: "`composite` must be in range for the test: ACT 1-36, SAT 400-1600, PSAT 320-1520."
      properties:
        test: { $ref: "#/components/schemas/TestKind" }
        takenOn: { type: string, format: date }
        official: { type: boolean }
        composite: { type: integer }
        sections:
          type: object
          propertyNames: { minLength: 1, maxLength: 30 }
          additionalProperties: { type: integer, minimum: 0, maximum: 800 }
    Superscore:
      type: object
      required: [test, composite, sections, fromDates]
      properties:
        test: { $ref: "#/components/schemas/TestKind" }
        composite: { type: integer }
        sections: { type: object, additionalProperties: { type: integer } }
        fromDates: { type: array, items: { type: string, format: date } }
    RetakeAnalysisInput:
      type: object
      additionalProperties: false
      required: [test, targetComposite]
      properties:
        test: { type: string, enum: [ACT, SAT] }
        targetComposite: { type: integer, minimum: 1, maximum: 1600 }
    StudySession:
      type: object
      additionalProperties: false
      required: [title, minutes, weekStart, dueOn]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        minutes: { type: integer, minimum: 10, maximum: 240 }
        weekStart: { type: string, format: date }
        dueOn: { type: [string, "null"], format: date }
    StudyPlanInput:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions: { type: array, minItems: 1, maxItems: 40, items: { $ref: "#/components/schemas/StudySession" } }

    # ---------- impact ----------
    VerificationStatus:
      type: string
      enum: [self_reported, requested, verified, declined]
    ServiceLog:
      type: object
      required: [id, organization, activity, servedOn, minutes, supervisorName, supervisorEmail, verification, verificationExpiresAt, verifiedAt, verifierNote, reflection, createdAt]
      properties:
        id: { type: string, format: uuid }
        organization: { type: string }
        activity: { type: string }
        servedOn: { type: string, format: date }
        minutes: { type: integer }
        supervisorName: { type: string }
        supervisorEmail: { type: string }
        verification: { $ref: "#/components/schemas/VerificationStatus" }
        verificationExpiresAt:
          type: [string, "null"]
          format: date-time
          description: When the supervisor link expires. Past it while `requested`, the student can ask again (R2P-10).
        verifiedAt: { type: [string, "null"], format: date-time }
        verifierNote: { type: string }
        reflection: { type: string }
        createdAt: { type: string, format: date-time }
    ServiceLogInput:
      type: object
      additionalProperties: false
      required: [organization, activity, servedOn, minutes]
      properties:
        organization: { type: string, minLength: 1, maxLength: 200 }
        activity: { type: string, minLength: 1, maxLength: 200 }
        servedOn: { type: string, format: date }
        minutes: { type: integer, minimum: 1, maximum: 1440 }
        supervisorName: { type: string, maxLength: 120, default: "" }
        supervisorEmail:
          default: ""
          oneOf:
            - { type: string, format: email, maxLength: 254 }
            - { const: "" }
        reflection: { type: string, maxLength: 2000, default: "" }
    ServiceLogPatch:
      type: object
      additionalProperties: false
      properties:
        organization: { type: string, minLength: 1, maxLength: 200 }
        activity: { type: string, minLength: 1, maxLength: 200 }
        servedOn: { type: string, format: date }
        minutes: { type: integer, minimum: 1, maximum: 1440 }
        supervisorName: { type: string, maxLength: 120 }
        supervisorEmail:
          oneOf:
            - { type: string, format: email, maxLength: 254 }
            - { const: "" }
        reflection: { type: string, maxLength: 2000 }
    VerificationRequestView:
      type: object
      required: [studentFirstName, organization, activity, servedOn, minutes, expiresAt]
      properties:
        studentFirstName: { type: string }
        organization: { type: string }
        activity: { type: string }
        servedOn: { type: string, format: date }
        minutes: { type: integer }
        expiresAt: { type: string, format: date-time }
    VerificationSubmitInput:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed: { type: boolean }
        note: { type: string, maxLength: 500, default: "" }
    Activity:
      type: object
      required: [id, position, name, role, organization, description, hoursPerWeek, weeksPerYear, grades, category]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, minimum: 1, maximum: 10 }
        name: { type: string }
        role: { type: string }
        organization: { type: string }
        description: { type: string }
        hoursPerWeek: { type: integer }
        weeksPerYear: { type: integer }
        grades: { type: array, items: { type: integer } }
        category: { type: string }
    ActivityInput:
      type: object
      additionalProperties: false
      required: [position, name]
      description: Upserted by `position` (the slot on the Common App list).
      properties:
        position: { type: integer, minimum: 1, maximum: 10 }
        name: { type: string, minLength: 1, maxLength: 100 }
        role: { type: string, maxLength: 50, default: "" }
        organization: { type: string, maxLength: 100, default: "" }
        description: { type: string, maxLength: 150, default: "", description: 150 characters max (counted as code points). }
        hoursPerWeek: { type: integer, minimum: 0, maximum: 80, default: 0 }
        weeksPerYear: { type: integer, minimum: 0, maximum: 52, default: 0 }
        grades: { type: array, maxItems: 5, default: [], items: { type: integer, minimum: 9, maximum: 13 } }
        category: { type: string, maxLength: 60, default: "" }
    RequirementProgress:
      type: object
      required: [scholarshipId, scholarshipName, requiredHours, verifiedHours, totalHours]
      properties:
        scholarshipId: { type: string, format: uuid }
        scholarshipName: { type: string }
        requiredHours: { type: integer }
        verifiedHours: { type: number, minimum: 0 }
        totalHours: { type: number, minimum: 0 }

    # ---------- money ----------
    CostSource:
      type: string
      enum: [scorecard, calculator, offer]
    CostSummary:
      type: object
      required: [collegeId, collegeName, source, sourceLabel, costOfAttendanceUsd, freeMoneyUsd, gapUsd, pendingUsd, gapIfPendingWinUsd, isEstimate, budgetUsd, gapAfterBudgetUsd]
      properties:
        collegeId: { type: string }
        collegeName: { type: string }
        source: { $ref: "#/components/schemas/CostSource" }
        sourceLabel: { type: string }
        costOfAttendanceUsd: { $ref: "#/components/schemas/Usd" }
        freeMoneyUsd: { $ref: "#/components/schemas/Usd" }
        gapUsd: { $ref: "#/components/schemas/Usd" }
        pendingUsd: { $ref: "#/components/schemas/Usd" }
        gapIfPendingWinUsd: { $ref: "#/components/schemas/Usd" }
        isEstimate: { type: boolean }
        budgetUsd: { type: [integer, "null"], minimum: 0 }
        gapAfterBudgetUsd: { type: [integer, "null"], minimum: 0 }
    CalculatorResultInput:
      type: object
      additionalProperties: false
      required: [collegeId, costOfAttendanceUsd, grantsUsd]
      properties:
        collegeId: { $ref: "#/components/schemas/CollegeId" }
        costOfAttendanceUsd: { type: integer, minimum: 0, maximum: 200000 }
        grantsUsd: { type: integer, minimum: 0, maximum: 200000 }
    OfferStatus:
      type: string
      enum: [uploaded, parsing, needs_review, confirmed, failed]
    OfferLineCategory:
      type: string
      enum: [grant, scholarship, work_study, loan_federal_subsidized, loan_federal_unsubsidized, loan_parent_plus, loan_private, other]
    Offer:
      type: object
      required: [id, collegeId, collegeName, awardYear, documentId, status, costOfAttendanceUsd, createdAt, confirmedAt, parseJobId]
      properties:
        id: { type: string, format: uuid }
        collegeId: { type: string }
        collegeName: { type: string }
        awardYear: { $ref: "#/components/schemas/AwardYear" }
        documentId: { type: [string, "null"], format: uuid }
        status: { $ref: "#/components/schemas/OfferStatus" }
        costOfAttendanceUsd: { type: [integer, "null"], minimum: 0 }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: [string, "null"], format: date-time }
        parseJobId:
          type: [string, "null"]
          format: uuid
          description: The newest `offer.parse` job for this offer (D31). Follow `GET /jobs/{id}/events` while it runs.
    OfferLine:
      type: object
      required: [id, offerId, position, label, amountUsd, category, renewable, renewalCondition, page, citedText, userCorrected]
      properties:
        id: { type: string, format: uuid }
        offerId: { type: string, format: uuid }
        position: { type: integer, minimum: 0 }
        label: { type: string }
        amountUsd: { $ref: "#/components/schemas/Usd" }
        category: { $ref: "#/components/schemas/OfferLineCategory" }
        renewable: { type: boolean }
        renewalCondition: { type: string }
        page: { type: [integer, "null"], description: Letter page the line was read from. }
        citedText: { type: string, description: The letter text the line was read from. }
        userCorrected: { type: boolean }
    OfferWithLines:
      allOf:
        - $ref: "#/components/schemas/Offer"
        - type: object
          required: [lines]
          properties:
            lines: { type: array, items: { $ref: "#/components/schemas/OfferLine" } }
    CreateOfferInput:
      type: object
      additionalProperties: false
      required: [collegeId, documentId, awardYear]
      properties:
        collegeId: { $ref: "#/components/schemas/CollegeId" }
        documentId: { type: string, format: uuid, description: An `award_letter` document from POST /documents. }
        awardYear: { $ref: "#/components/schemas/AwardYear" }
    OfferLinePatch:
      type: object
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        amountUsd: { type: integer, minimum: 0, maximum: 200000 }
        category: { $ref: "#/components/schemas/OfferLineCategory" }
        renewable: { type: boolean }
    OfferColumn:
      type: object
      required: [offerId, collegeId, collegeName, costOfAttendanceUsd, freeMoneyUsd, workStudyUsd, loansUsd, letterSaysOweUsd, reallyCostsUsd, fourYearUsd, oneTimeFreeUsd, warnings]
      properties:
        offerId: { type: string }
        collegeId: { type: string }
        collegeName: { type: string }
        costOfAttendanceUsd: { $ref: "#/components/schemas/Usd" }
        freeMoneyUsd: { $ref: "#/components/schemas/Usd" }
        workStudyUsd: { $ref: "#/components/schemas/Usd" }
        loansUsd: { $ref: "#/components/schemas/Usd" }
        letterSaysOweUsd: { $ref: "#/components/schemas/Usd" }
        reallyCostsUsd: { $ref: "#/components/schemas/Usd" }
        fourYearUsd: { $ref: "#/components/schemas/Usd" }
        oneTimeFreeUsd: { $ref: "#/components/schemas/Usd" }
        warnings: { type: array, items: { type: string } }
    OfferComparison:
      type: object
      required: [columns, lowestFourYearOfferId, assumptions]
      properties:
        columns: { type: array, items: { $ref: "#/components/schemas/OfferColumn" } }
        lowestFourYearOfferId: { type: [string, "null"] }
        assumptions: { type: array, items: { type: string } }
    LoanEstimate:
      type: object
      required: [label, principalUsd, annualRatePct, years, monthlyUsd, totalInterestUsd]
      properties:
        label: { type: string }
        principalUsd: { $ref: "#/components/schemas/Usd" }
        annualRatePct: { type: number, minimum: 0, maximum: 30 }
        years: { type: integer, minimum: 1, maximum: 30 }
        monthlyUsd: { $ref: "#/components/schemas/Usd" }
        totalInterestUsd: { $ref: "#/components/schemas/Usd" }
    PublicOfferInput:
      type: object
      additionalProperties: false
      required: [offers]
      properties:
        offers:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [name, costOfAttendanceUsd, lines]
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              costOfAttendanceUsd: { type: integer, minimum: 0, maximum: 200000 }
              lines:
                type: array
                maxItems: 30
                items:
                  type: object
                  additionalProperties: false
                  required: [label, amountUsd, category, renewable]
                  properties:
                    label: { type: string, minLength: 1, maxLength: 120 }
                    amountUsd: { type: integer, minimum: 0, maximum: 200000 }
                    category: { $ref: "#/components/schemas/OfferLineCategory" }
                    renewable: { type: boolean }

