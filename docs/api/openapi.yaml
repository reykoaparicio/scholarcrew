    AidDeadline:
      type: object
      required: [id, awardYear, state, program, deadline, note, sourceUrl, verifiedAt]
      properties:
        id: { type: string, format: uuid }
        awardYear: { $ref: "#/components/schemas/AwardYear" }
        state: { type: [string, "null"] }
        program: { type: string }
        deadline: { type: [string, "null"], format: date }
        note: { type: string }
        sourceUrl: { type: string }
        verifiedAt: { type: string, format: date-time }
    AidDeadlineInput:
      type: object
      additionalProperties: false
      required: [awardYear, state, program, deadline, sourceUrl]
      description: No `id` inserts; an `id` updates that row. `state` null is a federal deadline.
      properties:
        id: { type: string, format: uuid }
        awardYear: { $ref: "#/components/schemas/AwardYear" }
        state:
          oneOf:
            - $ref: "#/components/schemas/USState"
            - type: "null"
        program: { type: string, minLength: 1, maxLength: 80, description: Trimmed before the length check. }
        deadline: { type: [string, "null"], format: date }
        note: { type: string, maxLength: 300, default: "" }
        sourceUrl: { type: string, format: uri, maxLength: 2000 }
    FederalLoanRates:
      type: object
      additionalProperties: false
      required: [subsidized, unsubsidized, parent_plus]
      description: Annual interest rates in percent (6.39 means 6.39%).
      properties:
        subsidized: { type: number, minimum: 0, maximum: 30 }
        unsubsidized: { type: number, minimum: 0, maximum: 30 }
        parent_plus: { type: number, minimum: 0, maximum: 30 }
    AidRuleKey:
      type: string
      enum: [federal_loan_rates]
    AidRule:
      type: object
      required: [id, awardYear, key, value, sourceUrl, verifiedAt]
      properties:
        id: { type: string, format: uuid }
        awardYear: { $ref: "#/components/schemas/AwardYear" }
        key: { $ref: "#/components/schemas/AidRuleKey" }
        value: { $ref: "#/components/schemas/FederalLoanRates" }
        sourceUrl: { type: string }
        verifiedAt: { type: string, format: date-time }
    AidRuleInput:
      type: object
      additionalProperties: false
      required: [awardYear, key, value, sourceUrl]
      properties:
        awardYear: { $ref: "#/components/schemas/AwardYear" }
        key: { $ref: "#/components/schemas/AidRuleKey" }
        value: { $ref: "#/components/schemas/FederalLoanRates" }
        sourceUrl: { type: string, format: uri, maxLength: 2000 }

    # ---------- plan ----------
    PlanItemKind:
      type: string
      enum: [scholarship, essay, application, aid, test_prep, service, recommendation, thank_you, custom]
    PlanItem:
      type: object
      required: [id, weekStart, title, kind, refType, refId, minutes, valueUsd, dueOn, status, contributors, priority, createdAt, completedAt]
      properties:
        id: { type: string, format: uuid }
        weekStart: { type: string, format: date, description: A Monday. }
        title: { type: string }
        kind: { $ref: "#/components/schemas/PlanItemKind" }
        refType: { type: [string, "null"] }
        refId: { type: [string, "null"] }
        minutes: { type: integer }
        valueUsd: { type: [integer, "null"], minimum: 0 }
        dueOn: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/TaskStatus" }
        contributors: { type: array, items: { $ref: "#/components/schemas/CrewRole" } }
        priority: { type: integer }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    PlanItemInput:
      type: object
      additionalProperties: false
      required: [title, kind, minutes]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        kind: { $ref: "#/components/schemas/PlanItemKind" }
        refType: { type: [string, "null"], maxLength: 40, default: null }
        refId: { type: [string, "null"], maxLength: 64, default: null }
        minutes: { type: integer, minimum: 0, maximum: 600 }
        valueUsd: { type: [integer, "null"], minimum: 0, maximum: 10000000, default: null }
        dueOn: { type: [string, "null"], format: date, default: null }
        contributors: { type: array, maxItems: 4, default: [], items: { $ref: "#/components/schemas/CrewRole" } }
        weekStart: { type: [string, "null"], format: date, default: null, description: Null means the current week. }
    PlanItemPatch:
      type: object
      additionalProperties: false
      properties:
        status: { $ref: "#/components/schemas/TaskStatus" }
        weekStart: { type: string, format: date, description: "Move to another week (\"Not this week\" sends next Monday)." }
    WeekPlan:
      type: object
      required: [weekStart, items, totalMinutes, doneCount]
      properties:
        weekStart: { type: string, format: date }
        items: { type: array, items: { $ref: "#/components/schemas/PlanItem" } }
        totalMinutes: { type: integer, minimum: 0 }
        doneCount: { type: integer, minimum: 0 }
    DeadlineKind:
      type: string
      enum: [scholarship, application, aid, essay, custom]
    Deadline:
      type: object
      required: [kind, title, dueOn, daysLeft, refType, refId, valueUsd, warning]
      properties:
        kind: { $ref: "#/components/schemas/DeadlineKind" }
        title: { type: string }
        dueOn: { type: string, format: date }
        daysLeft: { type: integer }
        refType: { type: string }
        refId: { type: string }
        valueUsd: { type: [integer, "null"], minimum: 0 }
        warning: { type: boolean }
    ThisWeekView:
      type: object
      required: [greetingName, weekStart, nextStep, plan, gap, deadlines, sweep, crewWorking]
      properties:
        greetingName: { type: string }
        weekStart: { type: string, format: date }
        nextStep:
          oneOf:
            - $ref: "#/components/schemas/PlanItem"
            - type: "null"
        plan: { $ref: "#/components/schemas/WeekPlan" }
        gap:
          oneOf:
            - $ref: "#/components/schemas/CostSummary"
            - type: "null"
        deadlines: { type: array, maxItems: 4, items: { $ref: "#/components/schemas/Deadline" } }
        sweep:
          oneOf:
            - $ref: "#/components/schemas/SweepSummary"
            - type: "null"
        crewWorking: { type: boolean }

    # ---------- helpers ----------
    HelperRole:
      type: string
      enum: [recommender, counselor, mentor]
    HelperLink:
      type: object
      required: [id, label, helperRole, scope, createdAt, expiresAt, revokedAt, lastUsedAt]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        helperRole: { $ref: "#/components/schemas/HelperRole" }
        scope: { type: array, items: { $ref: "#/components/schemas/HelperScope" } }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
    HelperLinkInput:
      type: object
      additionalProperties: false
      required: [label, helperRole, scope]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        helperRole: { $ref: "#/components/schemas/HelperRole" }
        scope: { type: array, minItems: 1, maxItems: 5, items: { $ref: "#/components/schemas/HelperScope" } }
        expiresInDays: { type: integer, minimum: 1, maximum: 90, default: 30 }
    HelperLinkCreated:
      type: object
      required: [link, url]
      properties:
        link: { $ref: "#/components/schemas/HelperLink" }
        url: { type: string, description: The shareable link with its token. Returned only here. }
    HelperView:
      type: object
      required: [studentName, helperRole, label, expiresAt, activities, stories, deadlines, colleges, scholarships, request]
      description: Each section is null when the link's scope doesn't include it.
      properties:
        studentName: { type: string }
        helperRole: { $ref: "#/components/schemas/HelperRole" }
        label: { type: string }
        expiresAt: { type: string, format: date-time }
        request:
          type: object
          description: The recommendation request behind this link (D38). Both fields are null for links not made by a recommendation request.
          required: [message, dueDate]
          properties:
            message: { type: [string, "null"] }
            dueDate: { type: [string, "null"], format: date }
        activities:
          oneOf:
            - { type: array, items: { $ref: "#/components/schemas/Activity" } }
            - type: "null"
        stories:
          oneOf:
            - type: array
              items:
                type: object
                required: [title, summary]
                properties:
                  title: { type: string }
                  summary: { type: string }
            - type: "null"
        deadlines:
          oneOf:
            - { type: array, items: { $ref: "#/components/schemas/Deadline" } }
            - type: "null"
        colleges:
          oneOf:
            - { type: array, items: { $ref: "#/components/schemas/CollegeListEntry" } }
            - type: "null"
        scholarships:
          oneOf:
            - type: array
              items:
                type: object
                required: [name, deadline, stage]
                properties:
                  name: { type: string }
                  deadline: { type: [string, "null"] }
                  stage: { type: string }
            - type: "null"

    # ---------- crew ----------
    RoomKind:
      type: string
      enum: [my_crew, family, temporary, scholarship, college, essay]
    Conversation:
      type: object
      required: [id, room, roomRefId, familyId, title, createdAt, expiresAt, lastMessageAt]
      properties:
        id: { type: string, format: uuid }
        room: { $ref: "#/components/schemas/RoomKind" }
        roomRefId: { type: [string, "null"] }
        familyId: { type: [string, "null"], format: uuid }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time, description: Set for temporary rooms. }
        lastMessageAt: { type: [string, "null"], format: date-time }
    ConversationInput:
      type: object
      additionalProperties: false
      required: [room]
      description: |
        `family` rooms need `familyId`. `scholarship`, `college`, and `essay` rooms need `roomRefId`
        (scholarship id or slug, college id, essay id). Family and context rooms are reused if one exists.
      properties:
        room: { $ref: "#/components/schemas/RoomKind" }
        roomRefId: { type: [string, "null"], maxLength: 64, default: null }
        familyId: { type: [string, "null"], format: uuid, default: null }
        title: { type: string, maxLength: 120, default: "" }
    CardId:
      type: string
      pattern: "^[a-z0-9_-]{1,32}$"
    CardLabel:
      type: string
      minLength: 1
      maxLength: 80
    ActionCard:
      oneOf:
        - $ref: "#/components/schemas/ActionCardAddPlanItem"
        - $ref: "#/components/schemas/ActionCardSaveScholarship"
        - $ref: "#/components/schemas/ActionCardAddCollege"
        - $ref: "#/components/schemas/ActionCardStartEssay"
        - $ref: "#/components/schemas/ActionCardOpenLink"
        - $ref: "#/components/schemas/ActionCardRecordDecision"
        - $ref: "#/components/schemas/ActionCardConfirmFact"
      discriminator:
        propertyName: kind
        mapping:
          add_plan_item: "#/components/schemas/ActionCardAddPlanItem"
          save_scholarship: "#/components/schemas/ActionCardSaveScholarship"
          add_college: "#/components/schemas/ActionCardAddCollege"
          start_essay: "#/components/schemas/ActionCardStartEssay"
          open_link: "#/components/schemas/ActionCardOpenLink"
          record_decision: "#/components/schemas/ActionCardRecordDecision"
          confirm_fact: "#/components/schemas/ActionCardConfirmFact"
    ActionCardAddPlanItem:
      type: object
      required: [kind, id, label, item]
      properties:
        kind: { const: add_plan_item }
        id: { $ref: "#/components/schemas/CardId" }
        label: { $ref: "#/components/schemas/CardLabel" }
        item: { $ref: "#/components/schemas/PlanItemInput" }
    ActionCardSaveScholarship:
      type: object
      required: [kind, id, label, scholarshipId]
      properties:
        kind: { const: save_scholarship }
        id: { $ref: "#/components/schemas/CardId" }
        label: { $ref: "#/components/schemas/CardLabel" }
        scholarshipId: { type: string, format: uuid }
    ActionCardAddCollege:
      type: object
      required: [kind, id, label, collegeId, fit, plan]
      properties:
        kind: { const: add_college }
        id: { $ref: "#/components/schemas/CardId" }
        label: { $ref: "#/components/schemas/CardLabel" }
        collegeId: { $ref: "#/components/schemas/CollegeId" }
        fit: { $ref: "#/components/schemas/Fit" }
        plan: { $ref: "#/components/schemas/AppPlan" }
    ActionCardStartEssay:
      type: object
      required: [kind, id, label, essay]
      properties:
        kind: { const: start_essay }
        id: { $ref: "#/components/schemas/CardId" }
        label: { $ref: "#/components/schemas/CardLabel" }
        essay: { $ref: "#/components/schemas/EssayInput" }
    ActionCardOpenLink:
      type: object
      required: [kind, id, label, href]
      properties:
        kind: { const: open_link }
        id: { $ref: "#/components/schemas/CardId" }
        label: { $ref: "#/components/schemas/CardLabel" }
        href: { type: string, maxLength: 300, pattern: "^/(?!/)[^\\s]*$", description: Internal app path only. }
    ActionCardRecordDecision:
      type: object
      required: [kind, id, label, decision]
      properties:
        kind: { const: record_decision }
        id: { $ref: "#/components/schemas/CardId" }
        label: { $ref: "#/components/schemas/CardLabel" }
        decision: { $ref: "#/components/schemas/DecisionInput" }
    ActionCardConfirmFact:
      type: object
      required: [kind, id, label, fact]
      properties:
        kind: { const: confirm_fact }
        id: { $ref: "#/components/schemas/CardId" }
        label: { $ref: "#/components/schemas/CardLabel" }
        fact: { $ref: "#/components/schemas/FactInput" }
    ReceiptItem:
      type: object
      required: [kind, label, refId, sourceUrl, verifiedAt]
      properties:
        kind: { type: string, enum: [fact, record, catalog, calculation] }
        label: { type: string, minLength: 1, maxLength: 140 }
        refId: { type: [string, "null"], maxLength: 64 }
        sourceUrl: { type: [string, "null"], maxLength: 2000 }
        verifiedAt: { type: [string, "null"], format: date-time }
    SafetyFlag:
      type: string
      enum: [crisis, refusal, limit, partial]
    CrewReply:
      type: object
      required: [text, contributors, question, actionCards, receipt, safety, needsInput]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
        contributors: { type: array, minItems: 1, maxItems: 8, items: { $ref: "#/components/schemas/CrewRole" } }
        question: { type: [string, "null"], maxLength: 300 }
        actionCards: { type: array, maxItems: 4, items: { $ref: "#/components/schemas/ActionCard" } }
        receipt: { type: array, maxItems: 12, items: { $ref: "#/components/schemas/ReceiptItem" } }
        safety:
          oneOf:
            - $ref: "#/components/schemas/SafetyFlag"
            - type: "null"
        needsInput: { type: boolean }
    MessageAuthor:
      type: string
      enum: [user, crew]
    Message:
      type: object
      required: [id, conversationId, authorKind, authorUserId, body, reply, createdAt, appliedCardIds, sharedCategories]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        authorKind: { $ref: "#/components/schemas/MessageAuthor" }
        authorUserId: { type: [string, "null"], format: uuid }
        body: { type: string }
        reply:
          description: The structured crew reply. Null on user messages.
          oneOf:
            - $ref: "#/components/schemas/CrewReply"
            - type: "null"
        createdAt: { type: string, format: date-time }
        appliedCardIds: { type: array, items: { type: string } }
        sharedCategories:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/ShareCategory" }
    SendMessageInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000, description: "Trimmed before validation. `@Scout`-style mentions pick crew members." }
    SendMessageResponse:
      type: object
      required: [message, job]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        job: { $ref: "#/components/schemas/CrewJob" }
    JobKind:
      type: string
      enum: [crew_request, weekly_plan, essay_review, offer_parse, appeal_outline, retake_analysis]
    JobStatus:
      type: string
      enum: [queued, working, ready, needs_input, failed]
      description: "`ready`, `needs_input`, and `failed` are terminal."
    ProgressEvent:
      type: object
      required: [at, role, text]
      properties:
        at: { type: string, format: date-time }
        role:
          oneOf:
            - $ref: "#/components/schemas/CrewRole"
            - const: system
        text: { type: string, maxLength: 200 }
    CrewJob:
      type: object
      required: [id, kind, status, conversationId, requestMessageId, resultMessageId, refId, progress, error, safety, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/JobKind" }
        status: { $ref: "#/components/schemas/JobStatus" }
        conversationId: { type: [string, "null"], format: uuid }
        requestMessageId: { type: [string, "null"], format: uuid }
        resultMessageId: { type: [string, "null"], format: uuid }
        refId: { type: [string, "null"], description: "The essay, offer, or other record the job works on." }
        progress: { type: array, items: { $ref: "#/components/schemas/ProgressEvent" } }
        error: { type: [string, "null"] }
        safety:
          oneOf:
            - $ref: "#/components/schemas/SafetyFlag"
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ApplyActionInput:
      type: object
      additionalProperties: false
      required: [messageId, cardId]
      properties:
        messageId: { type: string, format: uuid }
        cardId: { $ref: "#/components/schemas/CardId" }
    ActionReceipt:
      type: object
      required: [id, messageId, cardId, appliedAt, result]
      properties:
        id: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        cardId: { type: string }
        appliedAt: { type: string, format: date-time }
        result:
          type: object
          additionalProperties: true
          description: "What the card created, such as `{ \"factId\": \"...\" }`."

    # ---------- catalog and admin ----------
    CatalogTaskKind:
      type: string
      enum: [research_candidate, user_submission, report, recheck_changed, import]
    CatalogTaskStatus:
      type: string
      enum: [open, in_review, resolved, rejected]
    ListingDraft:
      type: object
      required: [name, provider, url, amountMinUsd, amountMaxUsd, renewable, deadline, applicationFeeUsd, localArea, eligibility, requirements, fieldQuotes]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        provider: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string, maxLength: 2000 }
        amountMinUsd: { type: [integer, "null"], minimum: 0 }
        amountMaxUsd: { type: [integer, "null"], minimum: 0 }
        renewable: { type: [boolean, "null"] }
        deadline: { type: [string, "null"], format: date }
        applicationFeeUsd: { type: [integer, "null"], minimum: 0 }
        localArea: { $ref: "#/components/schemas/LocalArea" }
        eligibility: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/EligibilityRule" } }
        requirements: { $ref: "#/components/schemas/ScholarshipRequirements" }
        fieldQuotes:
          type: array
          maxItems: 30
          items:
            type: object
            required: [field, quote]
            properties:
              field: { type: string, maxLength: 40 }
              quote: { type: string, minLength: 1, maxLength: 400 }
    VerificationIssueCode:
      type: string
      enum: [missing_field, deadline_past, amount_invalid, quote_not_found, scam_signal, domain_not_allowed]
    VerificationReport:
      type: object
      required: [ok, issues, scamFlags]
      properties:
        ok: { type: boolean }
        issues:
          type: array
          items:
            type: object
            required: [code, field, message]
            properties:
              code: { $ref: "#/components/schemas/VerificationIssueCode" }
              field: { type: [string, "null"] }
              message: { type: string }
        scamFlags: { type: array, items: { $ref: "#/components/schemas/ScamFlag" } }
    CatalogTaskPayload:
      oneOf:
        - $ref: "#/components/schemas/CatalogTaskPayloadResearchCandidate"
        - $ref: "#/components/schemas/CatalogTaskPayloadUserSubmission"
        - $ref: "#/components/schemas/CatalogTaskPayloadReport"
        - $ref: "#/components/schemas/CatalogTaskPayloadRecheckChanged"
        - $ref: "#/components/schemas/CatalogTaskPayloadImport"
      discriminator:
        propertyName: type
        mapping:
          research_candidate: "#/components/schemas/CatalogTaskPayloadResearchCandidate"
          user_submission: "#/components/schemas/CatalogTaskPayloadUserSubmission"
          report: "#/components/schemas/CatalogTaskPayloadReport"
          recheck_changed: "#/components/schemas/CatalogTaskPayloadRecheckChanged"
          import: "#/components/schemas/CatalogTaskPayloadImport"
    CatalogTaskPayloadResearchCandidate:
      type: object
      required: [type, url, title, snippet, state, county, draft, report]
      properties:
        type: { const: research_candidate }
        url: { type: string }
        title: { type: string }
        snippet: { type: string }
        state: { type: string }
        county: { type: [string, "null"] }
        draft:
          oneOf:
            - $ref: "#/components/schemas/ListingDraft"
            - type: "null"
        report:
          oneOf:
            - $ref: "#/components/schemas/VerificationReport"
            - type: "null"
    CatalogTaskPayloadUserSubmission:
      type: object
      required: [type, url, name, notes, submittedById]
      properties:
        type: { const: user_submission }
        url: { type: string }
        name: { type: string }
        notes: { type: string }
        submittedById: { type: string, format: uuid }
        draft:
          description: The extracted listing draft, when the submission was researched. May be absent on older tasks.
          oneOf:
            - $ref: "#/components/schemas/ListingDraft"
            - type: "null"
        report:
          description: The verification report for the draft. May be absent on older tasks.
          oneOf:
            - $ref: "#/components/schemas/VerificationReport"
            - type: "null"
    CatalogTaskPayloadReport:
      type: object
      required: [type, reportId, reason, details]
      properties:
        type: { const: report }
        reportId: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/ReportReason" }
        details: { type: string }
    CatalogTaskPayloadRecheckChanged:
      type: object
      required: [type, url, before, after, report]
      properties:
        type: { const: recheck_changed }
        url: { type: string }
        before:
          oneOf:
            - $ref: "#/components/schemas/ListingDraft"
            - type: "null"
        after:
          oneOf:
            - $ref: "#/components/schemas/ListingDraft"
            - type: "null"
        report:
          oneOf:
            - $ref: "#/components/schemas/VerificationReport"
            - type: "null"
    CatalogTaskPayloadImport:
      type: object
      required: [type, summary]
      properties:
        type: { const: import }
        summary: { type: string }
    CatalogTask:
      type: object
      required: [id, kind, status, scholarshipId, payload, createdById, resolvedById, resolutionNote, createdAt, resolvedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/CatalogTaskKind" }
        status: { $ref: "#/components/schemas/CatalogTaskStatus" }
        scholarshipId: { type: [string, "null"], format: uuid }
        payload: { $ref: "#/components/schemas/CatalogTaskPayload" }
        createdById: { type: [string, "null"], format: uuid }
        resolvedById: { type: [string, "null"], format: uuid }
        resolutionNote: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, "null"], format: date-time }
    CatalogTaskResolution:
      type: object
      additionalProperties: false
      required: [status, note]
      properties:
        status: { type: string, enum: [resolved, rejected] }
        note: { type: string, maxLength: 1000 }
        publishScholarshipId: { type: [string, "null"], format: uuid, default: null }
    ScholarshipUpsertInput:
      type: object
      additionalProperties: false
      required: [id, slug, name, provider, url, sourceUrl, amountMinUsd, amountMaxUsd, renewable, renewalTerms, deadline, cycle, localArea, eligibility, requirements, estMinutes, scamFlags]
      description: |
        The full listing. `amountMinUsd` must not exceed `amountMaxUsd`. On POST the server
        replaces `id` with null (always creates); on PATCH the path id replaces it.
      properties:
        id: { type: [string, "null"], format: uuid }
        slug: { type: string, minLength: 3, maxLength: 120, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        name: { type: string, minLength: 1, maxLength: 200 }
        provider: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string, format: uri, maxLength: 2000 }
        sourceUrl: { type: string, format: uri, maxLength: 2000 }
        amountMinUsd: { $ref: "#/components/schemas/Usd" }
        amountMaxUsd: { $ref: "#/components/schemas/Usd" }
        renewable: { type: boolean }
        renewalTerms: { type: string, maxLength: 500 }
        deadline: { type: [string, "null"], format: date }
        cycle: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        localArea: { $ref: "#/components/schemas/LocalArea" }
        eligibility: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/EligibilityRule" } }
        requirements: { $ref: "#/components/schemas/ScholarshipRequirements" }
        estMinutes: { type: integer, minimum: 5, maximum: 600 }
        scamFlags: { type: array, items: { $ref: "#/components/schemas/ScamFlag" } }
    ScholarshipStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/CatalogStatus" }
        note: { type: string, maxLength: 1000, default: "" }
    ReportStatus:
      type: string
      enum: [open, resolved, rejected]
    CatalogReport:
      type: object
      required: [id, scholarshipId, scholarshipName, reporterId, reason, details, status, createdAt, resolvedAt]
      properties:
        id: { type: string, format: uuid }
        scholarshipId: { type: string, format: uuid }
        scholarshipName: { type: string }
        reporterId: { type: [string, "null"], format: uuid }
        reason: { $ref: "#/components/schemas/ReportReason" }
        details: { type: string }
        status: { $ref: "#/components/schemas/ReportStatus" }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, "null"], format: date-time }
    ResolveReportInput:
      type: object
      additionalProperties: false
      required: [status, note]
      properties:
        status: { type: string, enum: [resolved, rejected] }
        note: { type: string, maxLength: 1000 }
    ImportResult:
      type: object
      required: [inserted, updated, skipped, errors]
      properties:
        inserted: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        errors:
          type: array
          items:
            type: object
            required: [line, message]
            properties:
              line: { type: integer, description: CSV line number (1 is the header). }
              message: { type: string }
    AuditEvent:
      type: object
      required: [id, actorId, actorKind, action, entityType, entityId, meta, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: [string, "null"], format: uuid }
        actorKind: { type: string }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        meta: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    PageAuditEvent:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, description: Always 20. }
        total: { type: integer, minimum: 0 }
    ResearchInput:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, minLength: 2, maxLength: 2 }
        county: { type: string, maxLength: 100 }

    # ---------- notifications ----------
    NotificationKind:
      type: string
      enum: [new_matches, deadline, job_ready, family, digest, system]
    Notification:
      type: object
      required: [id, kind, title, body, link, createdAt, readAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/NotificationKind" }
        title: { type: string }
        body: { type: string }
        link: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
    NotificationPrefs:
      type: object
      required: [digestDay, digestHour, emailEnabled, smsEnabled, phoneSet, quietStartHour, quietEndHour]
      properties:
        digestDay: { type: integer, minimum: 0, maximum: 6, description: 0 is Sunday. }
        digestHour: { type: integer, minimum: 0, maximum: 23 }
        emailEnabled: { type: boolean }
        smsEnabled: { type: boolean }
        phoneSet: { type: boolean }
        quietStartHour: { type: integer, minimum: 0, maximum: 23 }
        quietEndHour: { type: integer, minimum: 0, maximum: 23 }
    NotificationPrefsPatch:
      type: object
      additionalProperties: false
      properties:
        digestDay: { type: integer, minimum: 0, maximum: 6 }
        digestHour: { type: integer, minimum: 0, maximum: 23 }
        emailEnabled: { type: boolean }
        smsEnabled: { type: boolean }
        phone: { type: [string, "null"], pattern: "^\\+[1-9]\\d{7,14}$", description: E.164. Null clears it. }
        quietStartHour: { type: integer, minimum: 0, maximum: 23 }
        quietEndHour: { type: integer, minimum: 0, maximum: 23 }

    # ---------- extension ----------
    ApiTokenScope:
      type: string
      enum: [autofill, save_page]
    ApiToken:
      type: object
      required: [id, label, scopes, createdAt, lastUsedAt, revokedAt, expiresAt]
      properties:
        expiresAt: { type: string, format: date-time, description: 180 days after creation. }
        id: { type: string, format: uuid }
        label: { type: string }
        scopes: { type: array, items: { $ref: "#/components/schemas/ApiTokenScope" } }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    ApiTokenInput:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        scopes:
          type: array
          minItems: 1
          maxItems: 2
          default: [autofill, save_page]
          items: { $ref: "#/components/schemas/ApiTokenScope" }
    ApiTokenCreated:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: "#/components/schemas/ApiToken" }
        secret: { type: string, pattern: "^sct_[A-Za-z0-9_-]{43}$", description: Shown once. The server stores only its hash. }
    AutofillProfile:
      type: object
      required: [displayName, email, highSchool, classYear, city, state, gpa, intendedMajors, activities]
      properties:
        displayName: { type: string }
        email: { type: string, format: email }
        highSchool: { type: string }
        classYear: { type: [integer, "null"] }
        city: { type: string }
        state: { type: string }
        gpa: { type: [number, "null"] }
        intendedMajors: { type: array, items: { type: string } }
        activities: { type: array, items: { $ref: "#/components/schemas/Activity" } }
    SavePageInput:
      type: object
      additionalProperties: false
      required: [url, title]
      properties:
        url: { type: string, format: uri, maxLength: 2000 }
        title: { type: string, minLength: 1, maxLength: 200 }
        selectedText: { type: string, maxLength: 2000, default: "", description: "Stored as the submission notes, cut to 1000 characters." }

paths:
  # ===================== Auth =====================
  /auth/magic-link:
    post:
      tags: [Auth]
      operationId: requestMagicLink
      summary: Email a one-time sign-in link
      description: |
        Always 204 for a valid address, whether or not an account exists. The link expires in
        15 minutes. Limited to 5 per 15 minutes per IP and 5 per 15 minutes per email.
      x-auth: none
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagicLinkRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/verify:
    get:
      tags: [Auth]
      operationId: verifyMagicLink
      summary: Follow a sign-in link and start a session
      x-auth: none
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "303":
          description: |
            Signed in: `Location` is `<APP_URL>/onboarding` for a student who hasn't finished
            onboarding, else `<APP_URL>/week`, and the session cookie is set. A new account whose
            email has a pending parent invite is created as a parent, so it lands on `/week`
            (R2I-2). A bad, used, or expired link redirects to `<APP_URL>/sign-in?error=link`
            without a cookie.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
  /auth/sign-out-all:
    post:
      tags: [Auth]
      operationId: signOutEverywhere
      summary: Revoke every session and extension token and clear this cookie
      x-auth: user
      responses:
        "204": { description: Signed out everywhere. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /family/invites/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [Family]
      operationId: revokeInvite
      summary: Student revokes a pending family invitation
      x-auth: user
      responses:
        "204": { description: Invitation revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/sign-out:
    post:
      tags: [Auth]
      operationId: signOut
      summary: End the current session
      description: |
        Deletes the session when the cookie names one, then always answers 204 with the clearing
        cookie, including for an expired or unknown session or no cookie at all. The Origin check
        still applies.
      x-auth: optional
      security:
        - {}
        - cookieAuth: []
      responses:
        "204":
          description: Signed out. The cookie is always cleared.
          headers:
            Set-Cookie: { $ref: "#/components/headers/ClearSessionCookie" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /dev/outbox/latest:
    get:
      tags: [Auth]
      operationId: devOutboxLatest
      summary: Newest dev-outbox email to an address (dev and e2e only)
      description: Exists only when `ENABLE_DEV_ROUTES=1`; otherwise 404. Email lands in the outbox when `RESEND_API_KEY` is empty.
      x-auth: none
      security: []
      parameters:
        - name: to
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 254 }
      responses:
        "200":
          description: The newest message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevOutboxMessage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ===================== Profile =====================
  /me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: The signed-in user, profile, family, and plan
      x-auth: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /profile:
    get:
      tags: [Profile]
      operationId: getProfile
      summary: Your profile
      x-auth: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    patch:
      tags: [Profile]
      operationId: updateProfile
      summary: Update profile fields
      x-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilePatch" }
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /onboarding:
    post:
      tags: [Profile]
      operationId: completeOnboarding
      summary: Finish onboarding
      description: |
        Saves the profile, starter colleges, and sensitive facts. A birth year under 13 blocks the
        account: 403 `forbidden` with `details.reason: "underage"`. Parents get 403 with no reason.
        Onboarding twice (a second tab, or a resubmit after a slow success) is 409 `conflict`.
      x-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingInput" }
      responses:
        "200":
          description: The updated MeResponse.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`conflict`: onboarding is already complete."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  # ===================== Memory =====================
  /facts:
    get:
      tags: [Memory]
      operationId: listFacts
      summary: Your memory facts, including candidates waiting for your OK
      x-auth: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MemoryFact" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Memory]
      operationId: createFact
      summary: Add a fact
      description: Sensitive keys are refused; use /sensitive-facts.
      x-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryFact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /facts/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Memory]
      operationId: updateFact
      summary: Change a fact's value or visibility
      x-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactPatch" }
      responses:
        "200":
          description: The updated fact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryFact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Memory]
      operationId: forgetFact
      summary: Forget a fact
      x-auth: user
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /facts/{id}/confirm:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Memory]
      operationId: confirmCandidate
      summary: Confirm a candidate fact the crew proposed
      x-auth: user
      responses:
        "200":
          description: The confirmed fact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryFact" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /facts/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Memory]
      operationId: rejectCandidate
      summary: Reject a candidate fact
      x-auth: user
      responses:
        "200":
          description: The rejected fact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemoryFact" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /decisions:
    get:
      tags: [Memory]
      operationId: listDecisions
      summary: Decisions you've recorded
      x-auth: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Decision" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Memory]
      operationId: recordDecision
      summary: Record a decision
      x-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecisionInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /decisions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [Memory]
      operationId: deleteDecision
      summary: Delete a decision
      x-auth: user
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sensitive-facts:
    get:
      tags: [Memory]
      operationId: listSensitiveFacts
      summary: Your sensitive facts, summarized
      description: Values are summarized for display. Sensitive facts are never sent to a model.
      x-auth: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SensitiveFactSummary" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    put:
      tags: [Memory]
      operationId: setSensitiveFact
      summary: Turn a sensitive fact on or off and set its value
      x-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SensitiveFactInput" }
      responses:
        "200":
          description: The fact's new summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SensitiveFactSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /sensitive-facts/share-income:
    post:
      tags: [Memory]
      operationId: shareIncomeRangeToStudent
      summary: Parent shares a household income range with a student
      x-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareIncomeInput" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ===================== Family =====================
  /family:
    get:
      tags: [Family]
      operationId: getFamily
      summary: Your family, or null if you aren't in one
      x-auth: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FamilyView"
                  - type: "null"
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /family/invites:
    post:
      tags: [Family]
      operationId: inviteToFamily
      summary: Email a family invite
      description: Limited to 20 per user per day.
      x-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteInput" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /family/invites/preview:
    get:
      tags: [Family]
      operationId: previewInvite
      summary: Who sent an invite, before you sign in or accept
      description: |
        No session needed: the token from the invite email is the credential. Unknown, expired,
        and used tokens are 404. Limited to 30 per IP per hour.
      x-auth: none
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: The `token` from the `/family/join?token=` link.
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /family/invites/accept:
    post:
      tags: [Family]
      operationId: acceptInvite
      summary: Accept an invite with the token from the email
      x-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteInput" }
      responses:
        "200":
          description: The family you joined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /family/members/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Family]
      operationId: removeFamilyMember
      summary: Remove a member from your family
      x-auth: user
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /family/leave:
    post:
      tags: [Family]
      operationId: leaveFamily
      summary: Leave your family
      x-auth: user
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /family/share-settings:
    get:
      tags: [Family]
      operationId: getShareSettings
      summary: A student's share settings
      description: Any member of the student's family can read them. 404 when you share no family with the student.
      x-auth: user
      parameters:
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
