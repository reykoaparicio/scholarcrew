        key: { type: string }
        title: { type: string }
        assignee: { $ref: "#/components/schemas/AssigneeKind" }
        status: { $ref: "#/components/schemas/TaskStatus" }
        dueOn: { type: [string, "null"], format: date }
        completedAt: { type: [string, "null"], format: date-time }
    AidChecklist:
      type: object
      required: [program, awardYear, collegeId, collegeName, items, doneCount, totalCount]
      properties:
        program: { $ref: "#/components/schemas/AidProgram" }
        awardYear: { $ref: "#/components/schemas/AwardYear" }
