  # ===================== Billing =====================
  /billing:
    get:
      tags: [Billing]
      operationId: getBilling
      summary: Your plan and this month's crew usage
      x-auth: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingView" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /billing/checkout:
    post:
      tags: [Billing]
      operationId: createCheckout
      summary: Start a Stripe Checkout session for a paid plan
      x-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "200":
          description: Redirect the browser to `url`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UrlResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
  /billing/portal:
    post:
      tags: [Billing]
      operationId: createPortal
      summary: Open the Stripe billing portal
      description: 400 when you have no Stripe customer yet.
      x-auth: user
      responses:
        "200":
          description: Redirect the browser to `url`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UrlResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /billing/webhook:
    post:
      tags: [Billing]
      operationId: stripeWebhook
      summary: Stripe event webhook
      description: |
        Called by Stripe. The `Stripe-Signature` header over the raw body is the auth; no Origin check.
        While `STRIPE_WEBHOOK_SECRET` is empty the route answers 404 and verifies nothing.
      x-auth: none
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A Stripe event, verified against the raw bytes.
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /billing/sponsor-code:
    post:
      tags: [Billing]
      operationId: redeemSponsorCode
      summary: Redeem a sponsor code
      description: Limited to 10 attempts per user per hour.
      x-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SponsorCodeInput" }
      responses:
        "200":
          description: The new subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ===================== Documents =====================
  /documents:
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: Your uploaded documents, newest first
      description: Own uploads only; documents are never shared with family or helpers (D27).
      x-auth: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DocumentMeta" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Documents]
      operationId: uploadDocument
      summary: Upload a document
      description: |
        Multipart form with `kind` and `file`. Up to 10 MB; PDF, plain text, PNG, or JPEG.
        Oversized requests get 413: from a declared `Content-Length` before the body is read,
        or as soon as a chunked body passes 10 MB plus multipart overhead.
        Limited to 20 uploads per user per hour.
      x-auth: user
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/DocumentUpload" }
            encoding:
              file:
                contentType: application/pdf, text/plain, image/png, image/jpeg
      responses:
        "201":
          description: Stored (encrypted).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /documents/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Documents]
      operationId: getDocument
      summary: Document metadata
      x-auth: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentMeta" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Delete a document and its bytes
      x-auth: user
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /documents/{id}/download:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Documents]
      operationId: downloadDocument
      summary: Download a document's bytes
      x-auth: user
      responses:
        "200":
          description: The file, as an attachment. `Content-Type` is the stored type.
          headers:
            Content-Disposition: { $ref: "#/components/headers/ContentDisposition" }
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
            text/plain:
              schema: { type: string }
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ===================== Account =====================
  /account/export:
    post:
      tags: [Account]
      operationId: requestExport
      summary: Start a full data export
      description: Runs as a background job. Limited to 5 per user per day.
      x-auth: user
      responses:
        "201":
          description: The queued export.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportRecord" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /account/exports/latest:
    get:
      tags: [Account]
      operationId: latestExport
      summary: Your newest export that hasn't expired
      description: Any status. `null` when there's none (D27).
      x-auth: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ExportRecord"
                  - type: "null"
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /account/exports/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Account]
      operationId: getExport
      summary: Export status, or the export file once it's ready
      x-auth: user
      parameters:
        - name: format
          in: query
          required: false
          description: |
            `json` (the default) downloads the whole export, which also carries the Markdown in its
            `markdown` field. `md` downloads only the Markdown. Any other value is 400.
          schema:
            type: string
            enum: [json, md]
            default: json
      responses:
        "200":
          description: |
            While `queued` or `failed`: the ExportRecord as JSON, whatever the `format`. Once `ready`:
            the export file as an attachment named `scholarcrew-export-YYYY-MM-DD.json`, or
            `scholarcrew-export-YYYY-MM-DD.md` with `format=md`. Check `Content-Disposition` to tell
            the record and the file apart.
          headers:
            Content-Disposition: { $ref: "#/components/headers/ContentDisposition" }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ExportRecord"
                  - type: object
                    description: The export file contents.
            text/markdown:
              schema:
                type: string
                description: "The Markdown export (`format=md`), starting with `# ScholarCrew export`. Sent as `text/markdown; charset=utf-8`."
        "400":
          description: "`invalid_input`: `format` is neither `json` nor `md`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /account:
    delete:
      tags: [Account]
      operationId: deleteAccount
      summary: Delete your account
      description: |
        Blocks the account, ends every session, and cancels an active Stripe subscription now.
        A purge job hard-deletes the data within 7 days. The next request with the old cookie is 401.
      x-auth: user
      responses:
        "204":
          description: Deleted. The cookie is cleared.
          headers:
            Set-Cookie: { $ref: "#/components/headers/ClearSessionCookie" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ===================== Extension =====================
  /extension/tokens:
    get:
      tags: [Extension]
      operationId: listApiTokens
      summary: Your extension tokens (without secrets)
      x-auth: user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ApiToken" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [Extension]
      operationId: createApiToken
      summary: Create an extension token
      description: The secret is in this response only.
      x-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiTokenInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiTokenCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /extension/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [Extension]
      operationId: revokeApiToken
      summary: Revoke an extension token
      x-auth: user
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /extension/autofill-profile:
    get:
      tags: [Extension]
      operationId: getAutofillProfile
      summary: Values the extension may propose for application forms
      description: The extension proposes these values; it never submits a form. CORS for `chrome-extension://` origins.
      x-auth: bearer
      security:
        - bearerAuth: [autofill]
      parameters:
        - $ref: "#/components/parameters/ExtensionOrigin"
      responses:
        "200":
          description: OK
          headers:
            Access-Control-Allow-Origin: { $ref: "#/components/headers/AllowOrigin" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutofillProfile" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    options:
      tags: [Extension]
      operationId: autofillProfilePreflight
      summary: CORS preflight
      x-auth: none
      security: []
      parameters:
        - $ref: "#/components/parameters/ExtensionOrigin"
      responses:
        "204":
          description: |
            For `chrome-extension://` origins: Allow-Origin (echoed), Allow-Headers
            `Authorization, Content-Type`, Allow-Methods `GET, POST, OPTIONS`, Max-Age 600,
            `Vary: Origin`. No CORS headers for other origins.
          headers:
            Access-Control-Allow-Origin: { $ref: "#/components/headers/AllowOrigin" }
  /extension/save-page:
    post:
      tags: [Extension]
      operationId: savePage
      summary: Save the current page as a local scholarship submission
      description: |
        Becomes a local submission visible only to you until an admin reviews it, and goes on your
        board as `planned` (R2C-12). The selection is stored as notes, cut to 1000 characters. CORS
        for `chrome-extension://` origins.
      x-auth: bearer
      security:
        - bearerAuth: [save_page]
      parameters:
        - $ref: "#/components/parameters/ExtensionOrigin"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavePageInput" }
      responses:
        "201":
          description: Created.
          headers:
            Access-Control-Allow-Origin: { $ref: "#/components/headers/AllowOrigin" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarshipSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    options:
      tags: [Extension]
      operationId: savePagePreflight
      summary: CORS preflight
      x-auth: none
      security: []
      parameters:
        - $ref: "#/components/parameters/ExtensionOrigin"
      responses:
        "204":
          description: Same CORS headers as the autofill preflight.
          headers:
            Access-Control-Allow-Origin: { $ref: "#/components/headers/AllowOrigin" }

  # ===================== Scholarships =====================
        "429": { $ref: "#/components/responses/RateLimited" }
  /scholarships:
    get:
      tags: [Scholarships]
      operationId: searchScholarships
      summary: Search the scholarship catalog
      description: Signed-out callers see published public listings only.
      x-auth: optional
      security:
        - {}
        - cookieAuth: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/USState" } }
        - { name: local, in: query, schema: { type: boolean }, description: "`true` or `false`." }
        - { name: renewable, in: query, schema: { type: boolean } }
        - { name: minUsd, in: query, schema: { type: integer, minimum: 0 } }
        - { name: deadlineBefore, in: query, schema: { type: string, format: date } }
        - name: openOn
          in: query
          description: Keep only listings still open on this date (deadline on or after it, or no deadline). F-18-3.
          schema: { type: string, format: date }
        - name: excludeScams
          in: query
          description: "`true` drops listings with scam flags (D39). Signed-out callers never see them either way."
          schema: { type: boolean }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageScholarshipSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /scholarships/local:
    post:
      tags: [Scholarships]
      operationId: submitLocalScholarship
      summary: Submit a local scholarship you found
      description: Visible only to you until an admin reviews it. It also goes on your board as `planned` (R2C-12).
      x-auth: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalSubmissionInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarshipSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /scholarships/{idOrSlug}:
    parameters:
      - name: idOrSlug
        in: path
        required: true
        description: Listing UUID or slug.
        schema: { type: string }
    get:
      tags: [Scholarships]
      operationId: getScholarship
      summary: A scholarship listing
      x-auth: optional
      security:
        - {}
        - cookieAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScholarshipDetail" }
