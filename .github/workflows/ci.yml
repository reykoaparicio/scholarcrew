name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scholarcrew
          POSTGRES_PASSWORD: scholarcrew
          POSTGRES_DB: scholarcrew
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U scholarcrew -d scholarcrew"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://scholarcrew:scholarcrew@localhost:5432/scholarcrew
      TEST_DATABASE_URL: postgres://scholarcrew:scholarcrew@localhost:5432/scholarcrew_test
      APP_URL: http://localhost:3000
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      ENCRYPTION_KEYS: ""
      ANTHROPIC_API_KEY: ""
      SCHOLARCREW_FAKE_MODEL: "1"
      RESEND_API_KEY: ""
      EMAIL_FROM: "ScholarCrew <crew@scholarcrew.example>"
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_PRICE_FAMILY: ""
      STRIPE_PRICE_SEASON: ""
      ENABLE_DEV_ROUTES: "1"
      CATALOG_ALLOWED_DOMAINS: ""
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_FROM: ""
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Create the test database
        run: psql "$DATABASE_URL" -c "CREATE DATABASE scholarcrew_test"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create .env for local-style scripts
        run: cp .env.example .env
      - run: pnpm --filter @scholarcrew/scripts check-env
      - run: pnpm db:migrate
      - run: pnpm db:migrate:test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @scholarcrew/web build
      - run: pnpm --filter @scholarcrew/extension build

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scholarcrew
          POSTGRES_PASSWORD: scholarcrew
          POSTGRES_DB: scholarcrew
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U scholarcrew -d scholarcrew"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://scholarcrew:scholarcrew@localhost:5432/scholarcrew
      TEST_DATABASE_URL: postgres://scholarcrew:scholarcrew@localhost:5432/scholarcrew_test
      APP_URL: http://localhost:3000
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      ENCRYPTION_KEYS: ""
      ANTHROPIC_API_KEY: ""
      SCHOLARCREW_FAKE_MODEL: "1"
      RESEND_API_KEY: ""
      EMAIL_FROM: "ScholarCrew <crew@scholarcrew.example>"
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_PRICE_FAMILY: ""
      STRIPE_PRICE_SEASON: ""
      ENABLE_DEV_ROUTES: "1"
      CATALOG_ALLOWED_DOMAINS: ""
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_FROM: ""
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Create the test database
        run: psql "$DATABASE_URL" -c "CREATE DATABASE scholarcrew_test"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create .env for local-style scripts
        run: cp .env.example .env
      - run: pnpm db:migrate
      - run: pnpm db:migrate:test
      - name: Install the Playwright browser
        run: pnpm --filter @scholarcrew/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
